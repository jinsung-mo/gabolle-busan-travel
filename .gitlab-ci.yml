# axMap CI
#
# 세 가지를 한다.
#   1. 선점   — claim 없이 고친 것이 들어왔는가      (claims)
#   2. 자리   — MR 이 한 칸씩 올라가는가             (verify:mr-target)
#   3. 합의   — 정족수를 채웠는가                    (governance)
#   그리고 머지된 것을 위로 올리고 태그를 붙인다      (promote · version)
#
# 1~3 은 모든 MR 에서, 승격과 버전은 머지된 뒤와 스케줄에서 돈다.
#
# 🔴 axMap 은 이제 이 저장소 안에 없다. npm 꾸러미 axmap-cli 를 npx 로 부른다.
#    (npx — 깔지 않고 npm 창고의 프로그램을 그 자리에서 한 번 실행하는 명령)
#    예전에는 ci/axmap/ 에 사본을 두었는데, 사본은 고칠 때마다 두 곳을 맞춰야 하고
#    한쪽만 고치면 팀 코드가 한 줄도 안 바뀌었는데 팀이 멈췄다.
#
# 🔴 axMap 자기 테스트(npm test · demo · smoke)는 여기 없다. axMap 은 자기
#    저장소에 있고 그쪽 CI 가 돌린다. 여기서는 npm 판을 부르기만 한다.
#    여행 서비스 파트(frontend/ · backend/)의 검증은 각 파트가 여기 더한다.
#
# 자세한 배경 — 러너가 무엇이고 왜 없으면 pending 인지, 봇 토큰이 왜 필요한지,
# 켜는 순서를 왜 틀리면 안 되는지 — 는 docs/CI.md 에 있다.
#
# ── 🔴 팀의 합의는 권한이 아니라 여기에 넣는다 ────────────────────────────────
#
# lab.ssafy.com 은 GitLab Community Edition 이다. 보호 브랜치의 "Allowed to merge"
# 를 **개인 단위로 지정하는 것은 Premium 기능**이고, CE 에는 역할 단위(No one /
# Maintainers / Developers)밖에 없다. 그래서 "봇만 머지한다" 는 규칙을 권한으로는
# 만들 수 없다 — 봇도 Maintainer 라 사람 Maintainer 와 구분되지 않는다.
#
# CE 에서 Maintainer 까지 실제로 묶는 장치는 하나뿐이다: **Pipelines must succeed.**
# (Settings → Merge requests → Merge checks) 이걸 켜면 아래 verify 가 빨간 동안은
# 누구도 — 규칙을 만든 사람도 — 머지 버튼을 누를 수 없다.
#
# 권한은 가진 사람이 언제든 우회할 수 있지만 필수 파이프라인은 모두에게 똑같이 걸린다.
# 그래서 지켜야 할 것은 전부 잡(job)으로 만든다.

default:
  image: node:20-alpine
  before_script:
    - apk add --no-cache git bash
    # 🔴 어느 판이 돌았는지 남긴다. 빨개졌을 때 '어제와 판이 다르네' 를 3초에 안다.
    #
    #    axmap --version 을 쓰지 않는다 — 그 명령은 버전이 아니라 도움말을 찍는다
    #    (종료 코드는 0이라 조용히 쓸모없는 줄이 남는다. 실측 2026-09-01).
    #    창고에 물어보면 latest 가 오늘 무엇으로 풀렸는지가 정확히 나온다.
    - echo "axmap-cli = $(npm view axmap-cli@$AXMAP_VERSION version)"

stages: [verify, release]

variables:
  # 🔴 되돌리는 손잡이. 평소에는 latest 라 아무도 안 건드린다.
  #
  #    새 판이 팀을 깨면 Settings -> CI/CD -> Variables 에서 AXMAP_VERSION 을
  #    어제 번호(예: 1.0.0)로 바꾼다. 프로젝트 변수가 여기 적힌 기본값을 이기므로
  #    커밋도 MR 도 없이 1분 안에 되돌아간다. 고정의 안전을 버리는 것이 아니라
  #    필요할 때만 꺼내 쓰는 것이다.
  AXMAP_VERSION: "latest"

# ── 선점 없이 고친 것이 들어왔는가 ───────────────────────────────────────────
#
# 장부(`axmap/claims` 브랜치)의 이력을 처음부터 재생하면서, 어느 시점에도
# 아무도 잡고 있지 않던 파일이 고쳐진 적이 있는지 본다.
#
# 🔴 왜 이 잡이 필요한가. claim 강제는 지금까지 **각자 PC 의 커밋 훅**뿐이었다.
#    setup 을 안 돌린 사람, `--no-verify` 를 쓴 사람, 웹 IDE 로 고친 사람에게는
#    아무 보호가 없다. 훅은 "설치했는가" 에 달려 있고, 한 사람이 안 하면 그날의
#    보호가 사라진다. **이 잡만은 설치 여부와 무관하다.**
#
# 🔴 GIT_DEPTH: 0 — 장부 이력을 처음부터 재생하므로 얕은 클론이면 못 센다.
claims:
  stage: verify
  variables:
    GIT_DEPTH: 0
  script:
    # 🔴 `--checkpoint` — 통과하면 "장부를 뿌리부터 여기까지 재생했고 깨끗했다" 를
    #    도장으로 남기고, 다음 감사는 그 뒤부터만 재생한다.
    #
    #    장부는 하루 100건씩 늘기만 하는데 감사는 매번 뿌리부터 재생해서, 이 잡 하나가
    #    17~25초에서 241초가 됐다 (2026-09-04 실측, S15P21E201-600). "최근 N개만 본다"
    #    로는 못 고친다 — 이 검사가 보장하는 문장이 "어느 시점에도 두 사람이 같은 파일을
    #    동시에 잡은 적이 없다" 라서, 최근만 보면 사흘 전 겹침이 영영 안 보인다.
    #    그래서 이력은 하나도 안 버리고 이미 본 구간만 다시 안 본다.
    #    (axMap 실측: 장부 600건에서 105.7초 → 8.6초, 장부 크기와 무관해진다)
    #
    #    🔴 도장을 남기려면 push 권한이 필요하다. 이 잡은 MR 에서만 돌고
    #       AXMAP_BOT_TOKEN 은 Protected(보호된 브랜치에서 도는 잡에만 값이 간다)라
    #       여기서는 못 남긴다. 그래서 도장은 아래 claims:checkpoint 가 찍는다.
    #
    #    🔴 도장을 못 남겨도 **판정은 그대로다.** 대가는 다음 감사가 느린 것이지
    #       검사가 헐거워지는 것이 아니다 (장부 push 실패와 정반대다).
    - npx -y axmap-cli@$AXMAP_VERSION audit --fetch --checkpoint
  rules:
    # ref/ 만 바뀐 MR 에서는 돌지 않는다 (ref/README.md)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['frontend/**/*', 'backend/**/*', 'ci/**/*', 'governance/**/*',
                'docs/**/*', '.gitlab-ci.yml', 'CLAUDE.md', 'setup.sh', 'setup.ps1']

# ── 도장을 찍는다 — 감사가 같은 구간을 다시 안 보게 ──────────────────────────
#
# 위 claims 는 MR 에서만 돌고 거기에는 쓰기 토큰이 오지 않는다 (AXMAP_BOT_TOKEN 이
# Protected 라 보호된 브랜치에서 도는 잡에만 값이 간다). 그래서 도장은 여기서 찍는다 —
# 머지되어 dev·main 에 들어온 뒤 도는 파이프라인이다. 도장은 공유 브랜치에 쌓이므로,
# 그것을 **읽기만** 하는 MR 쪽 감사는 권한 없이도 그만큼 빨라진다.
#
# 🔴 왜 claims 를 여기서도 돌리지 않고 잡을 따로 두나. 검사는 **권한이 없어야** 한다 —
#    누구의 MR 에서나 돌아야 하니까. 도장은 **권한이 있어야** 한다. 한 잡에 섞으면
#    토큰이 필요한 이유가 검사 쪽으로 번지고, 언젠가 "검사가 토큰 없이는 못 돈다" 가
#    된다. 그때 잃는 것은 속도가 아니라 강제력이다.
#
# 🔴 토큰이 없으면 알리고 **초록으로 끝난다.** 도장을 못 남긴 대가는 다음 감사가 느린
#    것이지 판정이 헐거워지는 것이 아니다 (장부 push 실패와 정반대다).
claims:checkpoint:
  stage: verify
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${AXMAP_BOT_TOKEN:-}" ]; then
        echo "AXMAP_BOT_TOKEN 이 없습니다. 도장을 남기지 않습니다 - 감사는 계속 느립니다."
        echo "버전 잡이 쓰는 것과 같은 토큰입니다 - Settings 의 CI/CD Variables 를 보세요."
        exit 0
      fi
      git remote set-url origin "https://oauth2:${AXMAP_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.name  "axmap-bot"
      git config user.email "axmap-bot@noreply.${CI_SERVER_HOST}"
      npx -y axmap-cli@$AXMAP_VERSION audit --fetch --checkpoint
  rules:
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/

# ── 백엔드가 실제로 빌드되는가 ───────────────────────────────────────────────
#
# 🔴 위의 claims·verify:mr-target·governance 는 전부 axMap(선점·합의) 층이라
#    Spring Boot 코드 자체가 컴파일되는지·테스트를 통과하는지는 아무것도 보지
#    않는다. 이번 세션에서 배포가 세 번 연속 실패했다 — Flyway 스키마 충돌,
#    RestClient.Builder 빈 누락, GoogleIdTokenVerifier 기본 생성자 없음 — 셋 다
#    로컬에서 `./gradlew build` 한 번이면 머지 전에 잡혔을 문제였다 (S15P21E201-266).
#
#    그래서 여기서만 Gradle 빌드를 검사로 추가한다. `backend/` 를 건드리지 않는
#    MR 은 돌지 않는다.
#
# 🔴 `services:` 와 건너뜀 검사가 없으면 이 잡은 **거짓말을 한다** (고지혁,
#    S15P21E201-266 후속). PostgreSQL 이 없으면 `PostgresAvailableCondition`
#    (backend/src/test/.../support)이 DB 테스트 클래스를 실패가 아니라
#    **건너뜀**으로 표시하고, `gradlew build`는 건너뛴 테스트를 실패로 안 본다 —
#    잡은 그대로 초록이다. 실측: DB 없이 137개 중 51개 건너뜀, 진짜 Postgres로
#    137개 전부 실행. 이 상태에서 실제로 놓친 결함이 하나 있었다 — 품질 게이트가
#    `gabolle` schema를 못 찾는 버그가 있었는데 테스트는 `public`에 표를 만들어서
#    187개 전부 초록이었다 (fix/back/S15P21E201-546).
backend:build:
  stage: verify
  image: eclipse-temurin:17-jdk
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: gabolle_test
    POSTGRES_USER: gabolle
    POSTGRES_PASSWORD: gabolle_ci
    GABOLLE_TEST_DB_URL: jdbc:postgresql://postgres:5432/gabolle_test
    GABOLLE_TEST_DB_USERNAME: gabolle
    GABOLLE_TEST_DB_PASSWORD: gabolle_ci
  before_script: []
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build --no-daemon
    # 🔴 아래가 이 잡의 절반이다 — DB 서비스가 안 뜨는 날 테스트가 전부
    #    건너뛰고도 초록이 되는 것을, 여기서 빨갛게 만든다.
    - |
      skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml \
                | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
      echo "건너뜀: $skipped"
      [ "$skipped" -eq 0 ] || { echo "🔴 건너뛴 테스트가 있다 — 이 초록은 아무것도 뜻하지 않는다"; exit 1; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['backend/**/*']

# ── 의존성 취약점 스캔 (OWASP A06) ────────────────────────────────────────────
#
# osv.dev(구글이 운영하는 취약점 데이터베이스, 계정·열쇠 필요 없음)에 잠금 파일의
# 실제 버전을 대조한다. Gradle 은 기본으로 잠금 파일을 안 쓰므로 backend/build.gradle
# 에 dependencyLocking 을 켜고 backend/gradle.lockfile 을 커밋해 뒀다
# (S15P21E201-680). frontend 쪽은 npm audit 이 이미 잠금 파일(package-lock.json)을
# 쓰므로 별도 잠금 설정이 필요 없다 — front/dev 에 같은 rules 로 추가한다.
#
# 🔴 심각도 HIGH 미만은 잡지 않는다 — 전부 빨갛게 하면 아무도 안 본다. OSV 결과의
#    groups[].max_severity(osv-scanner 가 계산해 주는 CVSS 점수 문자열)로 판정한다.
#    취약점은 있는데 이 필드가 없어서 **판정을 못 하면** — 모르는 것을 통과로
#    내지 않는다(docs/CI-RESILIENCE.md 원칙 5) — 빨갛게 끝내고 사람이 표를 보게 한다.
#
# 🔴 OSV_SCANNER_VERSION 을 latest 로 둔다 — AXMAP_VERSION 과 같은 이유다
#    (이 파일 머리말 참고). 새 판이 팀을 깨면 이 변수를 CI/CD Variables 에서
#    구체적인 태그(예: v2.5.1)로 덮어써서 되돌린다.
#
# 🔴 allow_failure: true (2026-09-07) — Pipelines must succeed 가 켜져 있어서,
#    이 잡을 blocking 으로 만들면 **이 잡을 처음 추가하는 MR 자체가 못 들어간다.**
#    지금 실측이 HIGH 39건(대부분 Spring Boot 4.0.0/Spring Security 7.0.0이
#    최신 GA라 이미 공개된 CVE)이라, 잡을 blocking 으로 켜는 순간 그 MR이
#    스스로를 막는 잠금 상태가 된다. 드러내는 것(사용자 확인, 2026-09-07)이
#    목적이라 우선 non-blocking 으로 켜고, 기존 39건을 정리하는 후속 티켓이
#    끝나면 이 줄을 지운다 — 그때부터 진짜로 막는다.
backend:dependency-scan:
  stage: verify
  allow_failure: true
  variables:
    OSV_SCANNER_VERSION: "latest"
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ "$OSV_SCANNER_VERSION" = "latest" ]; then
        URL="https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64"
      else
        URL="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
      fi
      curl -sSfL "$URL" -o /usr/local/bin/osv-scanner
      chmod +x /usr/local/bin/osv-scanner
      osv-scanner --version
    - osv-scanner scan --lockfile=backend/gradle.lockfile --format json > osv-report.json || true
    - |
      cat > /tmp/osv-gate.mjs <<'JS'
      import { readFileSync } from 'node:fs';
      const threshold = 7.0;
      const report = JSON.parse(readFileSync('osv-report.json', 'utf8'));
      let highCount = 0;
      let unknownCount = 0;
      const rows = [];
      for (const result of report.results || []) {
        for (const pkg of result.packages || []) {
          const name = `${pkg.package.name}@${pkg.package.version}`;
          for (const group of pkg.groups || []) {
            const raw = group.max_severity;
            const score = raw === undefined || raw === '' ? null : Number(raw);
            const ids = (group.ids || []).join(',');
            if (score === null || Number.isNaN(score)) {
              unknownCount++;
              rows.push([name, ids, 'UNKNOWN(' + raw + ')']);
            } else {
              rows.push([name, ids, score.toFixed(1)]);
              if (score >= threshold) highCount++;
            }
          }
        }
      }
      console.table(rows.map(([p, i, s]) => ({ package: p, ids: i, severity: s })));
      console.log('HIGH(>=7.0) 이상:', highCount, '| 판정 불가:', unknownCount);
      if (highCount > 0) {
        console.log('🔴 HIGH 이상 취약점이 있다 — S15P21E201-680');
        process.exit(1);
      }
      if (unknownCount > 0) {
        console.log('🔴 심각도 판정 불가 항목이 있다 — 통과로 내지 않는다');
        process.exit(1);
      }
      JS
      node /tmp/osv-gate.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['backend/**/*']

# ── 마이그레이션 버전이 거꾸로 가지 않는가 (S15P21E201-703) ────────────────────
#
# 🔴 2026-09-07 새벽 운영이 이걸로 두 번 죽었다. 새 마이그레이션 파일 번호가
#    대상 브랜치에 이미 있는 최대 번호보다 작은데 나중에 머지되면, Flyway가
#    "이미 더 큰 번호가 적용된 DB" 에서만 out-of-order 로 기동을 거부한다.
#
#    backend:build 는 이걸 구조적으로 못 잡는다 — 매번 빈 DB에 마이그레이션을
#    처음부터 전부 적용하므로, 순서 역행이 드러나는 건 "이미 앞선 마이그레이션이
#    적용된 실제 DB" 뿐이다(jaehyeon 실측). 그래서 DB 없이 파일명만 비교한다.
#
# 🔴 대상 브랜치의 **지금 이 순간의 tip** 과 비교한다(GIT_DEPTH: 0 으로 받아
#    fetch) — MR 을 만든 시점의 갈림점이 아니다. 갈림점 이후 다른 MR 이 먼저
#    머지돼 더 큰 번호가 이미 들어와 있을 수 있고, 실제로 오늘 그렇게 죽었다.
backend:migration-order:
  stage: verify
  variables:
    GIT_DEPTH: 0
  # 🔴 전역 before_script 를 지우지 않는다. 이 잡은 git 을 쓴다.
  #    node:20-alpine 에는 git 이 없어서 전역 준비 단계가 매번 깔아 준다.
  #    [] 로 덮으면 그 설치가 사라지고 아래 git fetch 가 exit 127(그런 명령 없음)로 죽는다.
  #    아래 mr:gates·verify:mr-target 이 [] 를 쓰는 것은 그 둘이 node 만 부르기 때문이다.
  before_script:
    - apk add --no-cache git bash
  script:
    - |
      # 🔴 이름을 붙여서 받는다. 그냥 `git fetch origin <브랜치>` 를 하면 결과가
      #    FETCH_HEAD 에만 남고 `origin/<브랜치>` 라는 이름으로는 안 생긴다.
      #    CI 의 저장소 사본은 필요한 것만 받도록 설정돼 있어서 그렇다.
      #    그러면 바로 아래 git diff 가 "그런 것 없다" 로 죽는다 — 출력도 없이 exit 1.
      #    검사 내용이 틀린 게 아니라 검사가 자기가 방금 받은 것을 못 찾는 것이다.
      git fetch origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --quiet
      ADDED=$(git diff --name-only --diff-filter=A "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" HEAD -- 'backend/src/main/resources/db/migration/V*.sql')
      if [ -z "$ADDED" ]; then
        echo "새로 추가된 마이그레이션 파일 없음 — 통과"
        exit 0
      fi
      MAX_EXISTING=$(git ls-tree -r --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" -- 'backend/src/main/resources/db/migration' \
        | grep -oE 'V[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
      MAX_EXISTING=${MAX_EXISTING:-0}
      echo "대상 브랜치(${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}) 기준 최대 버전: $MAX_EXISTING"
      FAILED=0
      for f in $ADDED; do
        V=$(basename "$f" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+')
        echo "새 마이그레이션: $f (버전 $V)"
        if [ "$V" -le "$MAX_EXISTING" ]; then
          echo "🔴 $f 의 버전($V)이 대상 브랜치의 기존 최대($MAX_EXISTING)보다 작거나 같다"
          echo "   Flyway가 이 버전을 out-of-order로 거부해 운영 기동이 실패한다."
          echo "   해결: 파일명 버전을 $((MAX_EXISTING + 10000)) 이후로 바꾼다 (git mv)."
          FAILED=1
        fi
      done
      [ "$FAILED" -eq 0 ] || exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['backend/src/main/resources/db/migration/**/*']

# ── 파이프라인이 존재하게 한다 ───────────────────────────────────────────────
#
# 🔴 이 잡이 없으면 `ref/` 만 바꾼 MR 은 **잡이 하나도 안 돌아 파이프라인 자체가
#    안 만들어진다.** 그런데 `Pipelines must succeed` 는 "파이프라인이 없으면"
#    머지를 막는다 — 검사를 면제해 줬더니 오히려 못 머지하는 상태가 된다.
#
#    그래서 아무 MR 에서나 도는 싼 잡을 하나 둔다. 하는 일은 무엇이 걸렸고
#    무엇이 건너뛰어졌는지 사람이 읽게 찍는 것뿐이다.
mr:gates:
  stage: verify
  before_script: []
  script:
    # 🔴 이 줄은 **반드시 작은따옴표로 감싼다.** 지우지 마라.
    #
    #    안 감싸면 YAML 이 이 항목을 plain scalar(따옴표 없는 값)로 읽는데, 그 안에
    #    콜론+공백이 있으면 거기서 끊어 "키: 값" 매핑으로 해석한다. 그러면 script 의
    #    원소 하나가 문자열이 아니라 map 이 되고 **설정 파일 전체가 무효**가 된다.
    #
    #    무서운 것은 실패하는 방식이다. 설정이 무효면 GitLab 은 잡을 **하나도 만들지
    #    않고** 파이프라인만 failed 로 찍는다. 화면에는 "어느 잡이 실패했는지" 가
    #    없다 — 실패한 잡이 없으니까. 원인을 찾을 단서가 어디에도 안 남는다.
    #
    #    2026-08-26 17:31(6cddf63 머지)부터 이 줄 하나로 저장소 전체 CI 가 멈췄다
    #    (S15P21E201-22). main 도, 그 뒤의 모든 MR 도 잡 0개로 빨갰다.
    #
    #    고친 뒤에는 GitLab 에게 직접 물어 확인한다 (npm test 로는 안 잡힌다):
    #      Settings 옆 CI/CD → Editor → Validate,  또는
    #      POST /api/v4/projects/:id/ci/lint  { "content": "<파일 내용>" }
    - 'echo "대상 브랜치 : ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-?}"'
    - echo ""
    - echo "이 MR 에 걸리는 문은 아래 잡들의 결과로 확인하세요."
    - echo "  ref/ 만 바꾼 MR 은 정족수·선점·사본 검사를 건너뜁니다 (ref/README.md)."
    - echo "  dev 로 올리는 MR 은 정족수를 요구하지 않습니다 — 진짜 관문은 dev 에서 나갈 때입니다."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── MR 이 한 칸씩 올라가는가 ─────────────────────────────────────────────────
#
# 기능 브랜치 → 파트 dev → 파트 브랜치 → 최상위 main. 건너뛰면 막는다.
#
# 🔴 왜 설정이 아니라 잡인가. Community Edition(무료판)에는 **"이 브랜치로는 MR 을
#    못 연다" 는 설정이 아예 없다.** 있는 것은 기본 대상 브랜치를 정해 두는 것뿐이고,
#    그건 사람이 드롭다운에서 바꾸면 그만이다.
#
# 🔴 이 잡은 제일 싸다 — 컨테이너를 띄우고 node 한 번 부르는 게 전부다.
#    그래서 `before_script` 의 apk 설치도 건너뛴다. 규칙 위반은 테스트가 3분 돌기
#    전에 알려주는 편이 낫다.
verify:mr-target:
  stage: verify
  before_script: []
  script:
    - npx -y axmap-cli@$AXMAP_VERSION mr-target
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── 합의 ────────────────────────────────────────────────────────────────────
#
# "이 변경은 정족수(통과에 필요한 최소 찬성 수)를 채웠는가" 하나만 묻는다.
# 판정 근거와 지키는 성질(G1~G5)은 axmap/governance/GOVERNANCE.md 에 있다.
#
# 종료 코드: 0 충족 · 2 미달(사람이 투표하면 풀린다) · 1 판정 불가(환경을 고친다)
#           · 4 정책 자체가 깨짐
#
# 🔴 GIT_DEPTH: 0 이 필요하다. GitLab 은 기본으로 얕은 클론(**최근 몇 커밋만
#    받아오는 것**)을 하는데, 게이트는 소스와 타깃의 **갈림점**(merge-base)을
#    구해야 한다. 얕으면 갈림점이 받아온 범위 밖에 있어 "바뀐 파일" 이 통째로
#    틀리고, 그러면 문턱을 엉뚱한 규칙에서 고른다.
#
# 🔴 이 잡이 붙기 전까지 거버넌스 층은 아무것도 막지 않았다. 지금부터는
#    `Pipelines must succeed` 가 켜져 있는 동안 표가 모자라면 머지 버튼이 안 열린다.
governance:
  stage: verify
  variables:
    GIT_DEPTH: 0
  script:
    - npx -y axmap-cli@$AXMAP_VERSION gate
  rules:
    # 🔴 dev 로 올리는 MR 에는 표를 요구하지 않는다.
    #
    #    dev 는 누구나 직접 push 할 수 있게 열어 둔 자리다. 거기로 가는 MR 에까지
    #    표를 걸면 하루 수십 건이 사람 둘을 기다리게 되고, 그러면 팀은 MR 을 안
    #    쓰고 dev 에 직접 밀어 넣는다 — 문을 세운 결과가 문을 우회하는 것이 된다.
    #
    #    진짜 관문은 **dev 에서 나갈 때**다. dev -> 파트 브랜치, 파트 브랜치 -> main.
    #    그 둘에만 표를 요구한다.
    #
    #    되돌리려면 아래 `&&` 뒤를 지운다.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /(^|\/)(main|func)$/
      changes: ['frontend/**/*', 'backend/**/*', 'ci/**/*', 'governance/**/*',
                'docs/**/*', '.gitlab-ci.yml', 'CLAUDE.md', 'setup.sh', 'setup.ps1']

# ── 버전 ────────────────────────────────────────────────────────────────────
#
# dev 에 들어오면 patch, func 에 들어오면 minor, main 에 들어오면 major.
# 계산은 tools/version.mjs 가 하고 근거는 docs/VERSIONING.md 에 있다.
#
# 🔴 태그를 push 하려면 쓰기 권한이 있는 토큰이 필요하다. CI 기본 토큰
#    (CI_JOB_TOKEN)은 저장소에 push 할 수 없다. 프로젝트 Access Token 을 만들어
#    CI/CD 변수 AXMAP_BOT_TOKEN (Masked + Protected) 에 넣는다.
#    없으면 이 잡은 **조용히 건너뛰지 않고** 계산만 하고 알린다 — 버전이 안 올라간
#    것을 아무도 모르는 상태가 제일 나쁘다.
version:
  stage: release
  script:
    - git fetch --tags --quiet
    - |
      if [ -z "${AXMAP_BOT_TOKEN:-}" ]; then
        echo "AXMAP_BOT_TOKEN 이 없습니다. 태그를 만들지 않고 계산만 합니다."
        npx -y axmap-cli@$AXMAP_VERSION version next --branch "$CI_COMMIT_BRANCH"
        echo ""
        echo "설정하려면: Settings -> Access Tokens 에서 Role=Maintainer 로 토큰을"
        echo "만들고 Settings -> CI/CD -> Variables 의 AXMAP_BOT_TOKEN"
        echo "(Masked + Protected) 에 붙여넣습니다."
        echo ""
        echo "scope 는 api 입니다. 태그 push 만이면 write_repository 로 충분하지만,"
        echo "같은 토큰이 승격 MR 을 만들고 머지하므로 api 가 필요합니다 — docs/CI.md 3절."
        echo ""
        echo "🔴 AXMAP_BOT_TOKEN 을 Protected 로 두면 보호 브랜치에서 도는 잡에만"
        echo "   값이 갑니다. 이 잡이 도는 브랜치가 보호 브랜치가 아니면 토큰이 빈 채로"
        echo "   여기까지 와서 초록으로 끝납니다 — 지금 보고 있는 이 메시지가 그 상태일"
        echo "   수 있습니다. 브랜치: ${CI_COMMIT_BRANCH:-?}"
        exit 0
      fi
      git remote set-url origin "https://oauth2:${AXMAP_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.name  "axmap-bot"
      git config user.email "axmap-bot@noreply.${CI_SERVER_HOST}"
      npx -y axmap-cli@$AXMAP_VERSION version bump --branch "$CI_COMMIT_BRANCH" --push
  rules:
    # MR 에서는 올리지 않는다. 머지되어 브랜치에 들어온 것만 버전을 갖는다.
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/

# ── 승격 ────────────────────────────────────────────────────────────────────
#
# 봇이 단계를 올린다.  <파트>/dev → <파트>/main → main
#
# 🔴 스케줄 파이프라인(**GitLab 이 정해진 시각에 스스로 돌리는 파이프라인**)에서만
#    돈다. 어느 단계를 올릴지는 스케줄마다 변수 PROMOTE_STEP 으로 준다:
#
#      Settings → CI/CD → Schedules 에서 둘을 만든다
#        매일  0 19 * * 1-5   PROMOTE_STEP = dev-to-part
#        매주  0 19 * * 5     PROMOTE_STEP = part-to-main
#
# 🔴 봇도 정족수를 통과해야 머지한다. 게이트가 미달(2)이면 머지 호출 자체가
#    일어나지 않고, 잡은 초록으로 끝난다 — "아직 표가 모자람" 은 고장이 아니다.
#
# 🔴 머지 호출에는 판정에 쓴 커밋 sha 가 실린다. 판정과 머지 사이에 커밋이 하나
#    들어오면 GitLab 이 거부하고, 봇은 재시도하지 않는다. 표는 커밋 하나에 묶여
#    있으므로(G3 — 헤드가 바뀌면 표가 효력을 잃는다) 바뀐 내용은 새로 표를 받아야 한다.
promote:
  stage: release
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${PROMOTE_STEP:-}" ]; then
        echo "PROMOTE_STEP 이 없습니다. 무엇을 올릴지 추측하지 않습니다."
        echo ""
        echo "Settings -> CI/CD -> Schedules 에서 이 스케줄에 변수를 넣으세요:"
        echo "  PROMOTE_STEP = dev-to-part   (<파트>/dev -> <파트>/main)"
        echo "  PROMOTE_STEP = part-to-main  (<파트>/main -> main)"
        exit 1
      fi
    - npx -y axmap-cli@$AXMAP_VERSION promote --step "$PROMOTE_STEP"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
