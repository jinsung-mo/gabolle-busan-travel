# axMap CI
#
# 세 가지를 한다.
#   1. 선점   — claim 없이 고친 것이 들어왔는가      (claims)
#   2. 자리   — MR 이 한 칸씩 올라가는가             (verify:mr-target)
#   3. 합의   — 정족수를 채웠는가                    (governance)
#   그리고 머지된 것을 위로 올리고 태그를 붙이고      (promote · version)
#   Jira 카드를 옮긴다                              (jira)
#
# 1~3 은 모든 MR 에서, 승격과 버전은 머지된 뒤와 스케줄에서 돈다.
#
# 🔴 axMap 은 이제 이 저장소 안에 없다. npm 꾸러미 axmap-cli 를 npx 로 부른다.
#    (npx — 깔지 않고 npm 창고의 프로그램을 그 자리에서 한 번 실행하는 명령)
#    예전에는 ci/axmap/ 에 사본을 두었는데, 사본은 고칠 때마다 두 곳을 맞춰야 하고
#    한쪽만 고치면 팀 코드가 한 줄도 안 바뀌었는데 팀이 멈췄다.
#
# 🔴 axMap 자기 테스트(npm test · demo · smoke)는 여기 없다. axMap 은 자기
#    저장소에 있고 그쪽 CI 가 돌린다. 여기서는 npm 판을 부르기만 한다.
#    여행 서비스 파트(frontend/ · backend/)의 검증은 각 파트가 여기 더한다.
#
# 자세한 배경 — 러너가 무엇이고 왜 없으면 pending 인지, 봇 토큰이 왜 필요한지,
# 켜는 순서를 왜 틀리면 안 되는지 — 는 docs/CI.md 에 있다.
#
# ── 🔴 팀의 합의는 권한이 아니라 여기에 넣는다 ────────────────────────────────
#
# lab.ssafy.com 은 GitLab Community Edition 이다. 보호 브랜치의 "Allowed to merge"
# 를 **개인 단위로 지정하는 것은 Premium 기능**이고, CE 에는 역할 단위(No one /
# Maintainers / Developers)밖에 없다. 그래서 "봇만 머지한다" 는 규칙을 권한으로는
# 만들 수 없다 — 봇도 Maintainer 라 사람 Maintainer 와 구분되지 않는다.
#
# CE 에서 Maintainer 까지 실제로 묶는 장치는 하나뿐이다: **Pipelines must succeed.**
# (Settings → Merge requests → Merge checks) 이걸 켜면 아래 verify 가 빨간 동안은
# 누구도 — 규칙을 만든 사람도 — 머지 버튼을 누를 수 없다.
#
# 권한은 가진 사람이 언제든 우회할 수 있지만 필수 파이프라인은 모두에게 똑같이 걸린다.
# 그래서 지켜야 할 것은 전부 잡(job)으로 만든다.

default:
  image: node:20-alpine
  before_script:
    - apk add --no-cache git bash
    # 🔴 어느 판이 돌았는지 남긴다. 빨개졌을 때 '어제와 판이 다르네' 를 3초에 안다.
    #
    #    axmap --version 을 쓰지 않는다 — 그 명령은 버전이 아니라 도움말을 찍는다
    #    (종료 코드는 0이라 조용히 쓸모없는 줄이 남는다. 실측 2026-09-01).
    #    창고에 물어보면 latest 가 오늘 무엇으로 풀렸는지가 정확히 나온다.
    - echo "axmap-cli = $(npm view axmap-cli@$AXMAP_VERSION version)"

stages: [verify, release]

variables:
  # 🔴 되돌리는 손잡이. 평소에는 latest 라 아무도 안 건드린다.
  #
  #    새 판이 팀을 깨면 Settings -> CI/CD -> Variables 에서 AXMAP_VERSION 을
  #    어제 번호(예: 1.0.0)로 바꾼다. 프로젝트 변수가 여기 적힌 기본값을 이기므로
  #    커밋도 MR 도 없이 1분 안에 되돌아간다. 고정의 안전을 버리는 것이 아니라
  #    필요할 때만 꺼내 쓰는 것이다.
  AXMAP_VERSION: "latest"

# ── 선점 없이 고친 것이 들어왔는가 ───────────────────────────────────────────
#
# 장부(`axmap/claims` 브랜치)의 이력을 처음부터 재생하면서, 어느 시점에도
# 아무도 잡고 있지 않던 파일이 고쳐진 적이 있는지 본다.
#
# 🔴 왜 이 잡이 필요한가. claim 강제는 지금까지 **각자 PC 의 커밋 훅**뿐이었다.
#    setup 을 안 돌린 사람, `--no-verify` 를 쓴 사람, 웹 IDE 로 고친 사람에게는
#    아무 보호가 없다. 훅은 "설치했는가" 에 달려 있고, 한 사람이 안 하면 그날의
#    보호가 사라진다. **이 잡만은 설치 여부와 무관하다.**
#
# 🔴 GIT_DEPTH: 0 — 장부 이력을 처음부터 재생하므로 얕은 클론이면 못 센다.
claims:
  stage: verify
  variables:
    GIT_DEPTH: 0
  script:
    # 🔴 이번에 들어온 커밋만 본다. 이력 전체를 보면 장부가 생기기 전 커밋까지
    #    위반으로 세어 켠 날부터 영원히 빨갛다.
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"
      else
        RANGE="${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}"
      fi
      echo "코드 대조 구간: $RANGE"
      # axmap 1.0.0 audit 내부의 git show가 기본 quote 설정을 따르므로,
      # 한글 파일명이 8진수 escape 경로로 바뀌어 claim과 불일치하지 않게 한다.
      git config core.quotepath false
      npx -y axmap-cli@$AXMAP_VERSION audit --fetch --code "$RANGE"
  rules:
    # ref/ 만 바뀐 MR 에서는 돌지 않는다 (ref/README.md)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['frontend/**/*', 'backend/**/*', 'ci/**/*', 'governance/**/*',
                'docs/**/*', '.gitlab-ci.yml', 'CONTRIBUTING.md', 'CLAUDE.md', 'AGENTS.md', 'setup.sh', 'setup.ps1']
    # 🔴 MR 을 안 거치고 **브랜치에 바로 push** 한 것도 검사한다.
    #
    #    dev 는 일부러 열어 둔 자리다 — 아래 governance 잡이 "dev 로 가는 MR 에는
    #    표를 요구하지 않는다" 고 적어 둔 그것이다. 그 자유가 성립하는 근거는
    #    **선점(claim)이 대신 막아 준다** 는 것인데, 정작 그 선점을 검사하는 잡이
    #    이것이고 지금까지 MR 에서만 돌았다. **직접 push 하는 순간 근거가 꺼졌다.**
    #
    #    남는 보호는 각자 PC 의 커밋 훅뿐이다. 그런데 훅은 "설치했는가" 에 달려
    #    있고 `--no-verify` 한 줄로 넘어가며 웹 IDE 에는 아예 없다 — 이 잡의 머리말이
    #    바로 그 이유로 잡이 필요하다고 적어 놓고, 정작 안 도는 경로를 남겨 뒀다.
    #
    #    🔴 changes 필터를 일부러 안 붙인다. 브랜치 push 에서 changes 는 **마지막
    #    커밋 하나**를 기준으로 판정하는데, 머지 커밋은 자기 자신이 바꾼 것이 없어
    #    보일 수 있어 통째로 건너뛴다. 게다가 audit 은 원래 장부 이력을 처음부터
    #    재생하는 검사라 "무엇이 바뀌었나" 로 좁힐 것이 아니다.
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/

# ── 파이프라인이 존재하게 한다 ───────────────────────────────────────────────
#
# 🔴 이 잡이 없으면 `ref/` 만 바꾼 MR 은 **잡이 하나도 안 돌아 파이프라인 자체가
#    안 만들어진다.** 그런데 `Pipelines must succeed` 는 "파이프라인이 없으면"
#    머지를 막는다 — 검사를 면제해 줬더니 오히려 못 머지하는 상태가 된다.
#
#    그래서 아무 MR 에서나 도는 싼 잡을 하나 둔다. 하는 일은 무엇이 걸렸고
#    무엇이 건너뛰어졌는지 사람이 읽게 찍는 것뿐이다.
mr:gates:
  stage: verify
  before_script: []
  script:
    # 🔴 이 줄은 **반드시 작은따옴표로 감싼다.** 지우지 마라.
    #
    #    안 감싸면 YAML 이 이 항목을 plain scalar(따옴표 없는 값)로 읽는데, 그 안에
    #    콜론+공백이 있으면 거기서 끊어 "키: 값" 매핑으로 해석한다. 그러면 script 의
    #    원소 하나가 문자열이 아니라 map 이 되고 **설정 파일 전체가 무효**가 된다.
    #
    #    무서운 것은 실패하는 방식이다. 설정이 무효면 GitLab 은 잡을 **하나도 만들지
    #    않고** 파이프라인만 failed 로 찍는다. 화면에는 "어느 잡이 실패했는지" 가
    #    없다 — 실패한 잡이 없으니까. 원인을 찾을 단서가 어디에도 안 남는다.
    #
    #    2026-08-26 17:31(6cddf63 머지)부터 이 줄 하나로 저장소 전체 CI 가 멈췄다
    #    (S15P21E201-22). main 도, 그 뒤의 모든 MR 도 잡 0개로 빨갰다.
    #
    #    고친 뒤에는 GitLab 에게 직접 물어 확인한다 (npm test 로는 안 잡힌다):
    #      Settings 옆 CI/CD → Editor → Validate,  또는
    #      POST /api/v4/projects/:id/ci/lint  { "content": "<파일 내용>" }
    - 'echo "대상 브랜치 : ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-?}"'
    - echo ""
    - echo "이 MR 에 걸리는 문은 아래 잡들의 결과로 확인하세요."
    - echo "  ref/ 만 바꾼 MR 은 정족수·선점·사본 검사를 건너뜁니다 (ref/README.md)."
    - echo "  dev 로 올리는 MR 은 정족수를 요구하지 않습니다 — 진짜 관문은 dev 에서 나갈 때입니다."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── MR 이 한 칸씩 올라가는가 ─────────────────────────────────────────────────
#
# 기능 브랜치 → 파트 dev → 파트 브랜치 → 최상위 main. 건너뛰면 막는다.
#
# 🔴 왜 설정이 아니라 잡인가. Community Edition(무료판)에는 **"이 브랜치로는 MR 을
#    못 연다" 는 설정이 아예 없다.** 있는 것은 기본 대상 브랜치를 정해 두는 것뿐이고,
#    그건 사람이 드롭다운에서 바꾸면 그만이다.
#
# 🔴 이 잡은 제일 싸다 — 컨테이너를 띄우고 node 한 번 부르는 게 전부다.
#    그래서 `before_script` 의 apk 설치도 건너뛴다. 규칙 위반은 테스트가 3분 돌기
#    전에 알려주는 편이 낫다.
verify:mr-target:
  stage: verify
  before_script: []
  script:
    - npx -y axmap-cli@$AXMAP_VERSION mr-target
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── 합의 ────────────────────────────────────────────────────────────────────
#
# "이 변경은 정족수(통과에 필요한 최소 찬성 수)를 채웠는가" 하나만 묻는다.
# 판정 근거와 지키는 성질(G1~G5)은 axmap/governance/GOVERNANCE.md 에 있다.
#
# 종료 코드: 0 충족 · 2 미달(사람이 투표하면 풀린다) · 1 판정 불가(환경을 고친다)
#           · 4 정책 자체가 깨짐
#
# 🔴 GIT_DEPTH: 0 이 필요하다. GitLab 은 기본으로 얕은 클론(**최근 몇 커밋만
#    받아오는 것**)을 하는데, 게이트는 소스와 타깃의 **갈림점**(merge-base)을
#    구해야 한다. 얕으면 갈림점이 받아온 범위 밖에 있어 "바뀐 파일" 이 통째로
#    틀리고, 그러면 문턱을 엉뚱한 규칙에서 고른다.
#
# 🔴 이 잡이 붙기 전까지 거버넌스 층은 아무것도 막지 않았다. 지금부터는
#    `Pipelines must succeed` 가 켜져 있는 동안 표가 모자라면 머지 버튼이 안 열린다.
governance:
  stage: verify
  variables:
    GIT_DEPTH: 0
  script:
    - npx -y axmap-cli@$AXMAP_VERSION gate
  rules:
    # 🔴 dev 로 올리는 MR 에는 표를 요구하지 않는다.
    #
    #    dev 는 누구나 직접 push 할 수 있게 열어 둔 자리다. 거기로 가는 MR 에까지
    #    표를 걸면 하루 수십 건이 사람 둘을 기다리게 되고, 그러면 팀은 MR 을 안
    #    쓰고 dev 에 직접 밀어 넣는다 — 문을 세운 결과가 문을 우회하는 것이 된다.
    #
    #    진짜 관문은 **dev 에서 나갈 때**다. dev -> 파트 브랜치, 파트 브랜치 -> main.
    #    그 둘에만 표를 요구한다.
    #
    #    되돌리려면 아래 `&&` 뒤를 지운다.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /(^|\/)(main|func)$/
      changes: ['frontend/**/*', 'backend/**/*', 'ci/**/*', 'governance/**/*',
                'docs/**/*', '.gitlab-ci.yml', 'CONTRIBUTING.md', 'CLAUDE.md', 'AGENTS.md', 'setup.sh', 'setup.ps1']

# ── 버전 ────────────────────────────────────────────────────────────────────
#
# dev 에 들어오면 patch, func 에 들어오면 minor, main 에 들어오면 major.
# 계산은 tools/version.mjs 가 하고 근거는 docs/VERSIONING.md 에 있다.
#
# 🔴 태그를 push 하려면 쓰기 권한이 있는 토큰이 필요하다. CI 기본 토큰
#    (CI_JOB_TOKEN)은 저장소에 push 할 수 없다. 프로젝트 Access Token 을 만들어
#    CI/CD 변수 AXMAP_BOT_TOKEN (Masked + Protected) 에 넣는다.
#
# 🔴 정정 (2026-09-07, S15P21E201-158) — 예전엔 토큰이 없으면 계산만 하고
#    `exit 0` 으로 초록 끝냈다. 그런데 이 잡은 머지 뒤(post-merge)에 도는
#    잡이라 머지를 막지 않는다 — 빨개져도 그날 리뷰·머지는 그대로 된다.
#    초록으로 끝내는 쪽이 "버전 태그가 안 붙었다" 는 사실을 숨겼다
#    (docs/CI-RESILIENCE.md 원칙 5 — 검사할 수 없으면 통과로 내지 않는다).
#    그래서 토큰이 없으면 **계산은 하되 잡은 빨갛게 끝낸다.**
#
#    실측 — 이 정정 시점에 `axmap-bot` Project Access Token(scope: api,
#    access_level: Maintainer)은 2026-09-01 에 만들어져 있었지만 CI/CD
#    Variables 에 한 번도 붙여진 적이 없었다(last_used_at: null) — 태그가
#    하나도 없었다(`git tag -l` 가 빈 목록을 냈다). 토큰을 rotate 해서
#    AXMAP_BOT_TOKEN 으로 붙였다. 만료일은 docs/HANDOVER.md 에 있다.
version:
  stage: release
  script:
    - git fetch --tags --quiet
    - |
      if [ -z "${AXMAP_BOT_TOKEN:-}" ]; then
        echo "AXMAP_BOT_TOKEN 이 없습니다. 태그를 만들지 않고 계산만 합니다."
        npx -y axmap-cli@$AXMAP_VERSION version next --branch "$CI_COMMIT_BRANCH"
        echo ""
        echo "설정하려면: Settings -> Access Tokens 에서 Role=Maintainer 로 토큰을"
        echo "만들고 Settings -> CI/CD -> Variables 의 AXMAP_BOT_TOKEN"
        echo "(Masked + Protected) 에 붙여넣습니다."
        echo ""
        echo "scope 는 api 입니다. 태그 push 만이면 write_repository 로 충분하지만,"
        echo "같은 토큰이 승격 MR 을 만들고 머지하므로 api 가 필요합니다 — docs/CI.md 3절."
        echo ""
        echo "🔴 AXMAP_BOT_TOKEN 을 Protected 로 두면 보호 브랜치에서 도는 잡에만"
        echo "   값이 갑니다. 이 잡이 도는 브랜치가 보호 브랜치가 아니면 토큰이 빈 채로"
        echo "   여기까지 와서 빨갛게 끝납니다 — 지금 보고 있는 이 메시지가 그 상태일"
        echo "   수 있습니다. 브랜치: ${CI_COMMIT_BRANCH:-?}"
        echo ""
        echo "이 잡은 머지를 막지 않는다(post-merge) — 빨개져도 리뷰·머지는 그대로"
        echo "된다. 그래도 초록으로 숨기지 않는다 (S15P21E201-158)."
        exit 1
      fi
      git remote set-url origin "https://oauth2:${AXMAP_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.name  "axmap-bot"
      git config user.email "axmap-bot@noreply.${CI_SERVER_HOST}"
      npx -y axmap-cli@$AXMAP_VERSION version bump --branch "$CI_COMMIT_BRANCH" --push
  rules:
    # MR 에서는 올리지 않는다. 머지되어 브랜치에 들어온 것만 버전을 갖는다.
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/

# ── Jira ────────────────────────────────────────────────────────────────────
#
# 머지되면 카드가 스스로 움직인다. 파트 dev·파트 브랜치는 진행 중, 최상위 main 은 완료.
# 왜 dev 에서 "완료" 를 안 찍는지, 왜 뒤로 안 가는지는 ci/jira-transition.mjs 머리말에 있다.
#
# 🔴 allow_failure 다. Jira 가 죽은 날 팀의 머지까지 막을 이유가 없다 —
#    이것은 게이트가 아니라 기록이다. 실패하면 노랗게 뜨고 그때는 손으로 옮긴다.
#
# 🔴 GIT_DEPTH: 0 이 필요하다. 기본은 얕은 클론이라 CI_COMMIT_BEFORE_SHA 가 받아온
#    범위 밖이면 git log 가 구간을 못 푼다. 그러면 카드를 하나도 못 찾는다.
jira:
  stage: release
  variables:
    GIT_DEPTH: 0
  allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - node ci/jira-transition.mjs
  rules:
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/

# ── 승격 ────────────────────────────────────────────────────────────────────
#
# 봇이 단계를 올린다.  <파트>/dev → <파트>/main → main
#
# 🔴 스케줄 파이프라인(**GitLab 이 정해진 시각에 스스로 돌리는 파이프라인**)에서만
#    돈다. 어느 단계를 올릴지는 스케줄마다 변수 PROMOTE_STEP 으로 준다:
#
#      Settings → CI/CD → Schedules 에서 둘을 만든다
#        매일  0 19 * * 1-5   PROMOTE_STEP = dev-to-part
#        매주  0 19 * * 5     PROMOTE_STEP = part-to-main
#
# 🔴 봇도 정족수를 통과해야 머지한다. 게이트가 미달(2)이면 머지 호출 자체가
#    일어나지 않고, 잡은 초록으로 끝난다 — "아직 표가 모자람" 은 고장이 아니다.
#
# 🔴 머지 호출에는 판정에 쓴 커밋 sha 가 실린다. 판정과 머지 사이에 커밋이 하나
#    들어오면 GitLab 이 거부하고, 봇은 재시도하지 않는다. 표는 커밋 하나에 묶여
#    있으므로(G3 — 헤드가 바뀌면 표가 효력을 잃는다) 바뀐 내용은 새로 표를 받아야 한다.
promote:
  stage: release
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${PROMOTE_STEP:-}" ]; then
        echo "PROMOTE_STEP 이 없습니다. 무엇을 올릴지 추측하지 않습니다."
        echo ""
        echo "Settings -> CI/CD -> Schedules 에서 이 스케줄에 변수를 넣으세요:"
        echo "  PROMOTE_STEP = dev-to-part   (<파트>/dev -> <파트>/main)"
        echo "  PROMOTE_STEP = part-to-main  (<파트>/main -> main)"
        exit 1
      fi
    - npx -y axmap-cli@$AXMAP_VERSION promote --step "$PROMOTE_STEP"
  rules:
    # 🔴 PROMOTE_STEP 이 있는 스케줄에서만 돈다.
    #
    #    예전에는 "스케줄이면 돈다" 였다. 그런데 스케줄은 승격만 쓰는 것이 아니다 —
    #    2026-09-01 에 vote:recheck 스케줄이 생기자 이 잡이 같이 깨어났고,
    #    PROMOTE_STEP 이 없으니 위 script 가 의도대로 exit 1 을 냈다.
    #    그래서 **10분마다 파이프라인이 빨개졌다** (#176479).
    #
    #    script 의 "무엇을 올릴지 추측하지 않는다" 는 맞다. 너무 넓었던 것은 rule 이다.
    #    스케줄이 늘어날 때마다 이 잡이 깨어나는 구조 자체를 막는다.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PROMOTE_STEP

# ── 표가 찼는데 화면이 아직 빨간 MR ─────────────────────────────────────────
#
# 표는 MR 밖(axmap/votes 브랜치)으로 들어온다. 그래서 표가 도착해도 GitLab 은
# 파이프라인을 다시 돌리지 않고, 화면에는 "0표" 로 판정한 옛 결과가 남는다.
# 2026-09-01 에 MR !31 이 정확히 그것으로 막혔다 — 표는 2/2 인데 판정은 5시간 전 것.
#
# 🔴 표 push 를 직접 트리거로 쓰지 않는다. axmap/votes 는 고아 브랜치라
#    .gitlab-ci.yml 이 없고, GitLab 은 push 된 브랜치에서 설정을 읽으므로
#    파이프라인이 아예 안 생긴다. 거기에 설정을 심으면 되기는 하지만, 그 브랜치는
#    MR 없이 push 되는 곳이라 **누구든 리뷰 없이 CI 가 돌릴 코드를 바꿀 수 있게**
#    된다. 3절이 정한 것과 정면으로 충돌한다. 즉시성 몇 분과 바꾸지 않는다.
#
#    Settings → CI/CD → Schedules 에 하나 만든다
#      */5 * * * *     SCHEDULE_KIND = vote-recheck
vote:recheck:
  stage: release
  variables:
    GIT_DEPTH: 0
  script:
    - node ci/vote-recheck.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "vote-recheck"

# ── CI 상태판 ───────────────────────────────────────────────────────────────
#
# 팀의 CI 상태를 한 장짜리 페이지로 만든다 (S15P21E201-701).
# 페이지와 수집기는 ci/status/ 에 있고, 사람이 읽는 설명은 ci/status/README.md 다.
#
# 하는 일은 둘이다.
#   1. GitLab API 에서 브랜치별 파이프라인·잡·러너 상태를 받아 ci-status.json 을 쓴다
#   2. 그 json 과 index.html 을 한 폴더에 담아 **아티팩트**로 남긴다
#      (아티팩트 — 잡이 끝난 뒤에도 GitLab 이 보관해 주는 결과 파일)
#
# 🔴 이 잡은 **운영 서버에 올리지 않는다. 못 올린다.**
#
#    이 저장소의 CI 에는 서버로 미는 길이 없다 — 2026-09-08 실측:
#      · 어느 브랜치의 .gitlab-ci.yml 에도 배포 잡이 없다 (stage 는 verify·release 뿐)
#      · CI/CD 변수에 SSH 키도, 서버 주소도, 배포용 자격증명도 없다
#      · 운영 서버 배포는 GitLab CI 가 아니라 **서버 위의 Jenkins** 가 한다
#        (docs/SERVER-SETUP.md 5절 · backend/Jenkinsfile)
#
#    없는 길을 지어내면 잡은 초록인데 화면은 안 바뀐다. 그래서 여기서 멈추고,
#    **서버에 올리는 마지막 한 걸음은 사람이 한 번 만든다** — 방법은
#    ci/status/README.md "배포" 절에 명령까지 그대로 적어 두었다.
#
# 🔴 예약 종류를 SCHEDULE_KIND 로 가른다. `$CI_PIPELINE_SOURCE == "schedule"` 만
#    보면 vote-recheck·promote 예약이 돌 때마다 이 잡도 같이 깨어난다. 위
#    promote 잡이 2026-09-01 에 정확히 그것으로 10분마다 빨개졌다 (#176479).
#    예약이 늘어날 때마다 이 잡이 깨어나는 구조를 아예 막는다.
#
#      Settings -> CI/CD -> Schedules 에 하나 만든다
#        0 * * * *      SCHEDULE_KIND = status      (매시 정각, 1시간마다)
status:publish:
  stage: release
  # git 도 axmap 도 안 쓴다. 컨테이너를 띄우고 node 한 번 부르는 게 전부라
  # 기본 before_script(apk 설치 + npm view)를 건너뛴다 — verify:mr-target 과 같은 이유다.
  before_script: []
  variables:
    # 얕은 클론으로 충분하다. 이 잡은 git 이력을 보지 않고 GitLab API 만 친다.
    GIT_DEPTH: 1
    # 🔴 토큰 값을 여기 적지 않는다. 이름만 적고 값은 CI/CD 변수에서 온다.
    #    CI_STATUS_TOKEN 이 없으면 collect.mjs 가 알아서 AXMAP_BOT_TOKEN 을 쓴다
    #    (찾는 순서: --token -> GITLAB_TOKEN -> GITLAB_PRIVATE_TOKEN
    #     -> AXMAP_BOT_TOKEN -> CI_JOB_TOKEN).
    #
    #    읽기만 하는 일이라 read_api 짜리 좁은 토큰을 따로 두는 편이 낫다.
    #    그래서 CI_STATUS_TOKEN 을 먼저 본다. 안 만들었으면 그냥 비워 두면 된다.
    GITLAB_TOKEN: $CI_STATUS_TOKEN
  script:
    - |
      if [ -z "${CI_STATUS_TOKEN:-}" ] && [ -z "${AXMAP_BOT_TOKEN:-}" ]; then
        echo "🔴 토큰이 없습니다. 아무것도 받지 못했고, 페이지도 만들지 않았습니다."
        echo ""
        echo "이 잡은 GitLab API 로 파이프라인 상태를 읽습니다. 비공개 저장소라"
        echo "인증 없이는 404 가 옵니다(없는 게 아니라 '너에게는 없다' 는 뜻입니다)."
        echo ""
        echo "둘 중 하나를 CI/CD 변수에 넣으세요 (Settings -> CI/CD -> Variables):"
        echo "  CI_STATUS_TOKEN   scope=read_api 짜리 좁은 토큰. 이 잡 전용. 권합니다"
        echo "  AXMAP_BOT_TOKEN   이미 있는 봇 토큰. 따로 안 만들려면 이걸 씁니다"
        echo ""
        echo "🔴 둘 다 Protected 로 두면 보호 브랜치에서 도는 잡에만 값이 갑니다."
        echo "   이 예약은 common/dev 에서 돌고 common/dev 는 */dev 규칙으로 보호돼"
        echo "   있으니 Protected 로 둬도 값이 옵니다. 브랜치: ${CI_COMMIT_BRANCH:-?}"
        echo ""
        echo "검사할 수 없으면 통과로 내지 않습니다 — docs/CI-RESILIENCE.md 원칙 5."
        exit 1
      fi
    - mkdir -p public/status
    - node ci/status/collect.mjs --out=public/status/ci-status.json
    - cp ci/status/index.html public/status/index.html
    - ls -l public/status
    - |
      echo ""
      echo "─────────────────────────────────────────────────────────────────"
      echo "여기까지가 CI 가 할 수 있는 전부입니다. 서버에 올리는 마지막 한 걸음은"
      echo "사람이 한 번 만들어 둬야 합니다 — ci/status/README.md '배포' 절."
      echo ""
      echo "이 잡의 결과물(최신 성공분)은 늘 이 주소에 있습니다:"
      echo "  ${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=status:publish"
      echo "─────────────────────────────────────────────────────────────────"
  artifacts:
    name: "ci-status-$CI_COMMIT_REF_SLUG"
    paths:
      - public/status
    # 매시간 도는 잡이라 오래 쌓아 둘 이유가 없다. 최신 성공분은 만료와 무관하게
    # 위 주소로 늘 받을 수 있다 (GitLab 이 latest 아티팩트는 따로 지켜 준다).
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "status"
