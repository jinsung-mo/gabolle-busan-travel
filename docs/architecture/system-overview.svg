<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">가볼래 프로젝트 전체 아키텍처</title>
  <desc id="desc">위쪽에는 Expo 앱과 웹 브라우저에서 Nginx, Spring Boot, PostgreSQL로 이어지는 서비스 요청을 가로로 배치했다. 아래쪽에는 별도로 운영하는 데이터 가공과 개인화 실험 인프라를 나란히 표시했다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4777D8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#259A92"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .title { fill: #17253C; font-size: 29px; font-weight: 750; }
      .subtitle { fill: #607087; font-size: 15px; }
      .section { fill: #1C3152; font-size: 16px; font-weight: 700; }
      .card-title { fill: #17253C; font-size: 18px; font-weight: 700; }
      .card-sub { fill: #52647C; font-size: 13px; }
      .small { fill: #607087; font-size: 12px; }
    </style>
  </defs>

