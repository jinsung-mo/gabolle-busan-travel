# 부산 추천 장소 설문 (S15P21E201-754)
#
# 🔴 이 묶음은 운영 서비스와 아무것도 나눠 쓰지 않는다.
#    서버에 이미 도는 local-route-personalization-postgres-1 은 운영 백엔드가
#    쓰는 데이터베이스다. 그걸 빌려 쓰면 설문 하나 때문에 서비스가 죽는다.
#    (실제로 그렇게 죽은 날이 있었다.) 그래서 컨테이너 · 볼륨 · 네트워크를
#    전부 새 이름으로 따로 만든다.
name: survey-recommend

services:
  postgres:
    image: postgres:16-alpine
    container_name: survey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: survey
      POSTGRES_USER: survey
      # 🔴 .env 에서 읽는다. 없으면 여기서 멈춘다 — 빈 비밀번호로 뜨지 않게.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 적어 주세요 (.env.example 참고)}
    volumes:
      - survey-pgdata:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때 한 번만 돈다. 이미 표가 있으면 다시 안 돈다.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [survey]
    # 🔴 포트를 호스트에 내주지 않는다. 앱 컨테이너만 같은 네트워크로 닿는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: survey-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://survey:${POSTGRES_PASSWORD}@postgres:5432/survey
      MOUNT_PATH: /survey
    ports:
      # 🔴 127.0.0.1 에만 묶는다. 바깥에서 3100 번으로 직접 못 들어온다 —
      #    앞에 선 nginx 가 https 로만 넘겨준다.
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [survey]

volumes:
  survey-pgdata:
    name: survey-pgdata

networks:
  survey:
    name: survey-net
