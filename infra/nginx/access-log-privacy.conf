# S15P21E201-1697 — 접속 기록에 사용자 좌표를 남기지 않는다.
#
# 운영 자리: /etc/nginx/conf.d/access-log-privacy.conf  (nginx.conf 의 http 블록이 conf.d/*.conf 를 읽는다)
# 적용·확인·되돌리기: 같은 폴더의 README.md. 🔴 이 파일만 넣으면 기록이 두 번 적힌다 — nginx.conf 의
#                    `access_log /var/log/nginx/access.log;` 한 줄을 함께 주석으로 돌려야 한다.
#
# 무엇을 하나
#   요청 줄의 물음표 뒤(쿼리)에 이름이 lat · lng · lon · latitude · longitude 로 **끝나는** 칸이 하나라도 있으면
#   (대소문자 무관 — originLat · destLng · userLatitude 도) 쿼리를 통째로 LOCATION_REDACTED 로 바꿔 적는다.
#   경로 · 방법 · 응답 코드 · 시각은 그대로 남는다. 그런 칸이 없는 요청은 지금과 한 글자도 다르지 않다(기본
#   combined 형식 그대로).
#
#   GET /api/v1/places/nearby?lat=35.15&lng=129.16&limit=20 HTTP/1.1
#     → GET /api/v1/places/nearby?LOCATION_REDACTED HTTP/1.1
#   GET /api/v1/routes/directions?originLat=35.1&originLng=129.1&destLat=35.2&destLng=129.2&mode=WALK HTTP/1.1
#     → GET /api/v1/routes/directions?LOCATION_REDACTED HTTP/1.1
#
# 🔴 S15P21E201-1718 — 처음 판(-1697)은 칸 이름이 그 다섯과 정확히 같을 때만 걸려서, 길찾기의 originLat·destLng 가
#    기록에 남았다. 끝이름으로 넓힌 대가로 좌표가 아닌데 이름이 그렇게 끝나는 칸(plat · salon …)도 가려진다 —
#    그 요청은 쿼리만 안 남을 뿐 경로·상태는 남는다. 2026-09-26 백엔드의 요청 칸 가운데 그렇게 끝나는 것은 전부
#    좌표였다(lat · lng · lon · originLat · originLng · destLat · destLng).
#
# 🔴 경로를 이름으로 고르지 않고 쿼리의 칸 이름으로 고른다 — 2026-09-11~25 운영 기록에서 좌표가 실린 경로가
#    여덟 곳이었다(내 주변 · 버스 · 날씨 · 지금 갈 곳 · 정류장 · 장소 목록 …). 경로를 적어 두면 새 화면이
#    생길 때마다 빠진다.
# 🔴 표시를 한글로 안 쓴다 — nginx 는 기록에 ASCII 밖의 글자를 \xNN 으로 바꿔 적는다.

map $request $gabolle_logged_request {
    "~*^(?<gabolle_head>\S+ [^?]*)\?(\S*&)?[^=&\s]*(lat|lng|lon|latitude|longitude)=\S*(?<gabolle_tail> \S+)$" "${gabolle_head}?LOCATION_REDACTED${gabolle_tail}";
    default $request;
}

# 기본 combined 와 같고 "$request" 자리만 바꿨다.
log_format gabolle_private '$remote_addr - $remote_user [$time_local] "$gabolle_logged_request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log gabolle_private;
