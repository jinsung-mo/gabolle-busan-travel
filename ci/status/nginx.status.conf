# 상태 페이지를 https://j15e201.p.ssafy.io/status 로 내보내는 nginx 설정 조각
# (S15P21E201-701)
#
# ─────────────────────────────────────────────────────────────────────────────
# 여기에는 페이지가 **둘** 있다. 헷갈리지 않게 먼저 갈라 둔다
#
#   /status/       가동 상태 — "지금 되나?" 에 3초 안에 답하는 페이지
#                  프론트·백엔드의 실제 배포와 MR 검사 속도, 지금 CPU,
#                  최근 1시간 CPU 최다 작업. 팀장이 요구한 그 넷이다.
#                  읽는 파일: status.json
#                  만드는 것: 서버 안의 cron 이 1분마다 collect-status.mjs
#
#   /status/ci/    CI 파이프라인 대시보드 — 브랜치별 잡 시간·러너를 파고드는 페이지
#                  읽는 파일: ci-status.json
#                  만드는 것: GitLab CI 예약(status:publish)이 만든 것을
#                             서버가 pull-ci-status.sh 로 받아 온다
#
# 🔴 **둘은 서로의 파일을 안 건드린다.** 폴더도 파일 이름도 다르다. 그래서 한쪽
#    수집이 죽어도 다른 쪽은 계속 뜬다. (자세한 이유는 ci/status/README.md 2절)
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일을 어디에 두고 어떻게 include 하나
#
# 이 파일은 **그 자체로는 아무 일도 하지 않는다.** nginx 의 `server { }` 블록
# **안에** 끼워 넣어야 하는 조각이다. 통째로 복사해 붙여도 되고, 아래처럼 파일로
# 두고 `include` 로 불러도 된다. 파일로 두는 쪽을 권한다 — 다음에 고칠 때
# `/etc/nginx/sites-available/default` 를 안 건드려도 되기 때문이다.
#
#   1) 서버에 조각 파일로 복사한다 (서버 계정은 ubuntu, SSH 로 들어간다)
#
#        sudo mkdir -p /etc/nginx/snippets
#        sudo cp nginx.status.conf /etc/nginx/snippets/status.conf
#
#      (`snippets` — nginx 가 "설정 조각을 모아 두는 곳" 으로 관례상 쓰는 폴더다.
#       우분투의 nginx 패키지가 처음부터 만들어 둔다. 특별한 기능은 없고,
#       include 로 불러 쓰는 평범한 폴더다.)
#
#   2) `/etc/nginx/sites-available/default` 를 연다. 그 파일 안에는 `server { }`
#      블록이 **셋** 있다. 반드시 **두 번째**, 곧 아래 두 줄을 가진 블록 안에 넣는다:
#
#        listen 443 ssl;                      ← Certbot 이 만든 HTTPS 서버
#        server_name j15e201.p.ssafy.io;
#
#      🔴 나머지 둘에 넣으면 안 된다. 하나는 `listen 80 default_server;` 의
#         기본 HTTP 서버이고, 다른 하나는 80 → 443 으로 되돌려 보내기만 하는
#         블록이다. 거기 넣으면 https 주소로 들어온 요청에는 아무 효과가 없다.
#         (근거: docs/SERVER-SETUP.md 3절 "리버스 프록시 설정 위치 — 실수하기 쉬운 지점")
#
#   3) 그 블록 안에 이 한 줄을 넣는다. `location / { … }` 보다 위에 두면 읽기 좋다
#      (동작은 순서와 무관하다 — 아래 "왜 순서를 신경 안 써도 되나" 참고):
#
#        include /etc/nginx/snippets/status.conf;
#
#   4) 파일을 놓을 폴더를 만들고 페이지를 넣는다 (설치 절차는 ci/status/README.md 6절)
#
#        sudo mkdir -p /srv/gabolle/www/status/ci
#        sudo chown -R ubuntu:ubuntu /srv/gabolle/www
#
#   5) 문법을 검사하고 반영한다. **검사 없이 reload 하지 않는다** — 문법이 틀린
#      채로 reload 하면 nginx 가 안 뜨고 사이트 전체가 내려간다
#
#        sudo nginx -t                 # "syntax is ok" · "test is successful" 확인
#        sudo systemctl reload nginx   # reload 는 접속을 끊지 않고 설정만 다시 읽는다
#
#   6) 확인
#
#        curl -I https://j15e201.p.ssafy.io/status/
#        curl -s https://j15e201.p.ssafy.io/status/status.json | head -c 300
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 순서를 신경 안 써도 되나
#
# 이 서버의 `location /` 는 프론트엔드 컨테이너(3000 포트)로 요청을 넘긴다.
# `/status/` 도 `/` 로 시작하니 그쪽으로 새어 나갈 것 같지만 그렇지 않다 —
# nginx 는 접두사(prefix) location 여럿이 걸리면 **적힌 순서가 아니라 가장 긴 것**을
# 고른다. `/status/`(8자)가 `/`(1자)보다 길므로 언제나 이쪽이 이긴다.
#
# 🔴 다만 `/jenkins/` 처럼 **정규식 location(`location ~ …`)** 이 나중에 추가되면
#    얘기가 달라진다. 정규식은 길이와 무관하게 접두사보다 먼저 잡는다. 지금
#    이 서버에는 정규식 location 이 없어서 문제가 없다 (2026-09-08 실측).
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 이 페이지는 로그인 없이 누구나 볼 수 있게 된다 — 팀장이 그렇게 정했다
#
# 그래서 가동 상태 페이지(`/status/`)에는 **사람 이름·커밋 번호·브랜치 이름·토큰을
# 넣지 않는다.** 수집기가 컨테이너 이름까지 가리고 온다 (`bims-<아이디>` 여섯 개는
# `bims 수집기` 하나로 묶인다).
#
# 🔴 반면 **`/status/ci/` 의 CI 대시보드에는 브랜치 이름·잡 이름·커밋 해시 앞자리·
#    파이프라인을 돌린 사람의 GitLab 아이디가 들어 있다.** 그쪽만 잠그고 싶으면
#    아래 `location /status/ci/` 의 "열람 제한" 주석을 켠다.

# ── /status 로 들어오면 /status/ 로 보낸다 ───────────────────────────────────
#
# 끝 슬래시가 없으면 nginx 는 아래 `location /status/` 에 안 걸리고 `location /`
# 로 떨어져 프론트엔드 컨테이너가 404 를 준다. 한 줄로 막는다.
# 🔴 팀장이 준 주소가 끝 슬래시 없는 `…/status` 라 이 줄이 특히 중요하다.
location = /status {
    return 301 /status/;
}

location = /status/ci {
    return 301 /status/ci/;
}

# ── 정적 파일로 서비스한다 ───────────────────────────────────────────────────
#
# 프록시가 아니다. 뒤에 떠 있는 프로그램이 없다 — 디스크의 파일을 그대로 준다.
# 그래서 이 페이지는 백엔드나 프론트 컨테이너가 죽어도 계속 뜬다.
# 🔴 **그것이 이 페이지의 존재 이유다.** 서비스가 죽은 날 보려고 만든 페이지가
#    죽은 서비스를 거쳐서 나오면 아무 소용이 없다.
location /status/ {
    # 🔴 `alias` 가 아니라 `root` 다. root 는 "요청 경로를 이 폴더 뒤에 그대로
    #    이어 붙인다" 는 뜻이라, /status/index.html → /srv/gabolle/www/status/index.html
    #    이 된다. alias 는 경로를 잘라 치환하는데 try_files 와 같이 쓰면 조용히
    #    엉뚱한 파일을 찾는 것으로 유명해서, 여기서는 쓰지 않는다.
    root /srv/gabolle/www;

    index index.html;

    # 없는 파일은 404 로 끝낸다. SPA 가 아니므로 index.html 로 되돌리지 않는다 —
    # 되돌리면 오타 난 주소에도 200 이 떠서 "있는 줄" 알게 된다.
    try_files $uri $uri/ =404;

    # 요청이 몰리는 것을 막는다. zone 이름 api_limit 은 이 서버에 이미 정의돼
    # 있다 (`/etc/nginx/sites-available/default` 맨 위,
    #  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s).
    # 🔴 그 줄을 지우면 여기도 같이 죽는다. nginx -t 가 "unknown limit_req zone"
    #    으로 잡아 준다.
    limit_req zone=api_limit burst=20 nodelay;

    # 🔴 페이지 자체도 오래 캐시하면 안 된다. 고쳐서 올려도 사람들 브라우저가
    #    옛날 것을 계속 보여준다. 1분이면 충분하다 — 데이터는 어차피 아래에서
    #    캐시를 완전히 끈다.
    add_header Cache-Control "public, max-age=60" always;
}

# ── 데이터 파일은 캐시하지 않는다 ────────────────────────────────────────────
#
# 🔴 이 블록이 없으면 페이지는 새 데이터를 받아도 **몇 분 전 숫자를 보여준다.**
#    브라우저·중간 프록시가 json 을 붙들고 있기 때문이다. 1분마다 갱신하는데
#    캐시가 5분이면, "지금 되나?" 에 5분 전 답을 하는 페이지가 된다.
#
#    `location =`(정확히 일치)라 위의 `/status/`(접두사)보다 항상 먼저 잡힌다.
#    그래서 두 블록의 순서는 상관없다.
#
#    🔴 `location` 이 바뀌면 root·limit_req 는 상속되지 않는 것이 아니라
#       **server 블록에서 다시 찾는다.** root 를 여기에도 적어 두는 이유다.
location = /status/status.json {
    root /srv/gabolle/www;
    default_type application/json;
    add_header Cache-Control "no-store, must-revalidate" always;
    limit_req zone=api_limit burst=20 nodelay;
    try_files $uri =404;
}

# ── CI 파이프라인 대시보드 — 같은 폴더의 한 칸 아래 ──────────────────────────
#
# 가동 상태 페이지와 **파일이 겹치지 않게** 한 칸 내려 두었다. GitLab CI 예약이
# 만든 것을 서버가 받아 와 여기에 놓는다 (README 7절).
location /status/ci/ {
    root /srv/gabolle/www;
    index index.html;
    try_files $uri $uri/ =404;
    limit_req zone=api_limit burst=20 nodelay;
    add_header Cache-Control "public, max-age=60" always;

    # ── 열람 제한 (기본 꺼짐) ────────────────────────────────────────────────
    # 🔴 이쪽에는 브랜치 이름·잡 이름·커밋 해시 앞자리·GitLab 아이디가 들어 있다.
    #    팀만 보게 하려면 아래 두 줄의 주석을 벗기고 비밀번호 파일을 만든다:
    #      sudo apt install apache2-utils -y
    #      sudo htpasswd -c /etc/nginx/.htpasswd-status gabolle
    # auth_basic "GABOLLE CI 대시보드";
    # auth_basic_user_file /etc/nginx/.htpasswd-status;
}

location = /status/ci/ci-status.json {
    root /srv/gabolle/www;
    default_type application/json;
    add_header Cache-Control "no-store, must-revalidate" always;
    limit_req zone=api_limit burst=20 nodelay;
    try_files $uri =404;

    # 위 블록에 열람 제한을 켰다면 여기도 같이 켜야 한다. 안 그러면 페이지는
    # 잠기는데 데이터 파일은 그대로 열려서 잠근 뜻이 없어진다.
    # auth_basic "GABOLLE CI 대시보드";
    # auth_basic_user_file /etc/nginx/.htpasswd-status;
}
