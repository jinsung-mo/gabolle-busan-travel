# common 파트의 CI 잡 — 이 파일은 common 담당자만 고친다.
#
# 🔴 뿌리 .gitlab-ci.yml 에 파트 잡을 넣지 마라. 2026-09-09 에 그 구조 때문에
#    여섯 파트가 승격할 때마다 같은 파일에서 충돌했고, bigData 의 LFS 훅 우회
#    한 줄을 잘못 받으면 태그 push 가 죽는 상황까지 갔다.
#
# 아직 비어 있다. 파트 잡을 여기로 옮기는 절차는 docs/CI-SPLIT.md 에 있다.

# 🔴 아래 한 줄을 지우지 마라 — 첫 잡을 옮겨 오기 전까지는 필요하다.
#
#    주석만 있는 파일은 YAML 이 "빈 값"(null)으로 읽고, GitLab 은 그것을
#    `Included file ... does not have valid YAML syntax!` 로 거부한다.
#    그러면 **잡이 하나도 안 만들어지고 파이프라인만 failed 로 찍힌다** —
#    화면에 실패한 잡이 없어서 원인을 찾을 단서가 안 남는다.
#    (2026-09-09 실측: 이 파일 여섯이 비어서 MR !462 가 그렇게 죽었다.)
#
#    점(.)으로 시작하는 이름은 GitLab 이 **잡으로 만들지 않는다**(숨은 잡).
#    이 파트의 첫 잡을 여기로 옮겨 오면 이 줄은 지워도 된다.
#
#    🔴 2026-09-12 — 아래에 첫 잡(verify:dataflow)이 들어왔다. 그래도 이 자리표시자는
#       **지우지 않는다.** 지금은 필요 없지만, 아래 잡이 언젠가 다른 파일로 옮겨 가서
#       이 파일이 다시 비면 그날 파이프라인이 통째로 죽는다. 한 줄 값이 그보다 싸다.
.common-part-placeholder:
  script:
    - "true"

# ── 데이터 흐름 조각 ─────────────────────────────────────────────────────────
#
# 가동 상태 페이지 아래의 흐름도는 파트마다 있는 `dataflow.json` 을 모아 그린다
# (S15P21E201-865). 그 조각들이 서로 맞는지를 여기서 본다 — 없는 칸을 가리키는
# 화살표, 겹치는 칸 이름, 모르는 단계, 이유 없이 "끊김" 이라고만 적은 것.
#
# 🔴 **왜 CI 에 두나.** 아키텍처 그림은 그려 놓으면 낡는다. 파일을 옮기면 그림이
#    조용히 틀려지고, 아무도 안 고치고, 반년 뒤엔 아무도 안 믿는다. 설치할 때만
#    보면 그 사이가 통째로 빈다. **MR 에서 잡아야 안 낡는다** — 팀이 지키기로 한
#    것은 권한이 아니라 코드의 조건에 둔다는 규칙 그대로다 (CONTRIBUTING 3절).
#
# 🔴 **이 잡은 "끊긴 곳이 있다" 고 빨개지지 않는다.** 끊긴 것은 사실이지 잘못이
#    아니고, 그걸로 머지를 막으면 사람들이 그림에 거짓을 적게 된다. 그러면 이
#    그림이 존재할 이유가 없어진다. 빨개지는 것은 **조각 자체가 말이 안 될 때**뿐이다.
#
# 러너가 브랜치 하나만 얕게 복제해도 괜찮다. 다른 브랜치를 보는 증거는 "있다" 만
# 증명하고 "없다" 는 주장하지 않게 되어 있다 (ci/status/flow/build-flow.mjs 2절).
verify:dataflow:
  stage: verify
  script:
    - node ci/status/flow/build-flow.mjs --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["*/dataflow.json", "ci/status/flow/**/*"]
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(main|func|dev)$/
      changes: ["*/dataflow.json", "ci/status/flow/**/*"]
