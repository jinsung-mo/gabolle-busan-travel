# backend 파트의 CI 잡 — 이 파일은 backend 담당자만 고친다.
#
# 🔴 뿌리 .gitlab-ci.yml 에 파트 잡을 넣지 마라. 2026-09-09 에 그 구조 때문에
#    여섯 파트가 승격할 때마다 같은 파일에서 충돌했고, bigData 의 LFS 훅 우회
#    한 줄을 잘못 받으면 태그 push 가 죽는 상황까지 갔다.
#
# 파트 잡을 여기로 옮기는 절차는 docs/CI-SPLIT.md 에 있다.

# ── 보정 계산 예약 (S15P21E201-1750) ─────────────────────────────────────────
#
# 매일 03:00(Asia/Seoul) 실제 방문 기록으로 체류 · 이동 보정을 계산해 운영 calibration_value 에 새 판을 쌓는다.
# 계산과 검사는 backend/calibration/ (README 「예약」 절에 운영 쪽 준비 · 되돌리기가 있다).
#
#   Settings → CI/CD → Schedules:  0 3 * * *  Asia/Seoul  ref back/dev  SCHEDULE_KIND = calibration
#
# 🔴 태그가 heavy 가 아니라 calibration 이다. heavy 는 팀원 개인 PC 러너(2148)도 달고 있다. 이 잡은 운영 DB 비밀번호와
#    터널 열쇠를 들고 돌기 때문에, EC2 보조 러너(2065)에만 단 calibration 태그로 고정한다.
# 🔴 비밀값(CALIBRATION_DB_PASSWORD · CALIB_SSH_KEY_B64 · CALIB_SSH_KNOWN_HOSTS)은 CI 변수(Masked · Protected)에만 있다.
#    Protected 라 보호된 브랜치(back/dev)의 파이프라인에만 주어지고, 기능 브랜치 MR 파이프라인에는 안 간다.
# 🔴 러너가 잡마다 CPU 2 · 메모리 4GB 로 제한한다(러너 설정). Spark 도 local[2] · 드라이버 2g 로 그 안에 든다.
# 🔴 시간: 이 PC 로컬 리허설(같은 이미지 · 같은 제한)에서 처음 81초(pyspark 받기 53초) · 캐시가 있으면 31초 ·
#    터널을 거치면 35초였다. timeout 20m 은 넉넉히 잡은 값이다.
calibration:run:
  stage: release
  tags: [calibration]
  image: eclipse-temurin:17-jdk
  # 운영 DB 에 쓰는 잡이라 끊기지 않게 하고, 둘이 겹쳐 같은 판 번호를 다투지 않게 한 번에 하나만.
  interruptible: false
  resource_group: calibration
  timeout: 20m
  variables:
    GIT_DEPTH: 1
    CALIB_CACHE_DIR: $CI_PROJECT_DIR/backend/calibration/.ci-cache
    CALIBRATION_DB_URL: jdbc:postgresql://127.0.0.1:15432/app_db
    CALIBRATION_DB_USER: calibration_job
    CALIB_SSH_TARGET: calib-tunnel@j15e201.p.ssafy.io
  cache:
    key: calibration-pip-jdbc
    paths: [backend/calibration/.ci-cache/]
  # 기본 before_script 는 알파인(apk) · node 용이라 이 이미지(우분투)에서 깨진다. 준비는 ci-run.sh 가 한다.
  before_script: []
  script:
    - bash backend/calibration/ci-run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "calibration"
