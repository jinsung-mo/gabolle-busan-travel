plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gabolle'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// S15P21E201-680 — OSV-Scanner(외부 계정 없이 osv.dev 를 조회하는 취약점 스캐너)가
// 실제 해석된 버전을 보게 하려면 잠금 파일이 있어야 한다. build.gradle 자체는
// 버전 범위나 BOM 이 껴 있어 스캐너가 직접 못 읽는다.
dependencyLocking {
	lockAllConfigurations()
}

// S15P21E201-680 — Spring Boot 4.0.8 이 관리하는 Tomcat 은 11.0.24 인데, 인증 우회 등
// CVSS 9.8 짜리 셋(GHSA-9xv2-5v5q-p794 · GHSA-gcx9-497g-6cp6 · GHSA-h3x4-894j-xpx5)이
// 11.0.25 에서만 고쳐졌다(Maven Central 확인, 2026-09-07). Spring Boot 의 다음 판을
// 기다리지 않고 이 좌표만 강제로 올린다.
ext['tomcat.version'] = '11.0.25'

// 같은 이유로 jackson-databind 도 올린다. 2026-09-28 에 공개된 셋(GHSA-q4xh-88c3-wmh7 은 CVSS 7.5 —
// 날짜 문자열의 끝없는 숫자 해석, GHSA-gx83-3vf8-gh7j · GHSA-wjgm-6hv5-3cvf)이 2.21.6 · 3.1.6 에서 고쳐졌다
// (osv.dev · Maven Central 확인, 2026-09-29). Boot 4 는 3.x 를 쓰고, 2.x 는 아직 2.x 를 부르는 라이브러리 몫이다 —
// 둘 다 올려야 스캐너가 초록이 된다.
ext['jackson-bom.version'] = '3.1.6'
ext['jackson-2-bom.version'] = '2.21.6'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	// S15P21E201-367/-213 — 사진 오브젝트 스토리지(S3 호환, MinIO 재사용). StoragePort 의
	// 두 번째 구현(S3FileStorage)이 쓴다. MinIO 공식 SDK 를 쓰는 이유는 어떤 S3 호환
	// 엔드포인트에도 그대로 붙기 때문이다 — MinIO 전용이 아니다.
	//
	// 🔴 8.6.0 — 8.5.17 에는 HIGH 취약점이 둘 있었다(backend:dependency-scan 실측,
	//    MR !404). minio 자체(GHSA-h7rh-xfpj-hpcm — XML 태그 값을 시스템 프로퍼티/환경변수로
	//    조용히 치환해 자격증명을 흘릴 수 있었다)는 8.6.0 이 고쳤다. 그 전이 의존성인
	//    bcprov-jdk18on(GHSA-574f-3g2m-x479)은 8.6.0 도 1.81 을 받아오는데 그 판은 아직
	//    안 고쳐졌다(고친 판은 1.81.1/1.80.2/1.84 부터) — 9.x 로 올리면 API 가 통째로
	//    바뀌어(공식 체인지로그 "entire code refactor") 이 티켓 범위를 넘어서므로,
	//    대신 아래에서 그 버전만 명시로 고정한다.
	implementation 'io.minio:minio:8.6.0'
	// minio 8.6.0 이 전이로 받아오는 bcprov-jdk18on 1.81 은 GHSA-574f-3g2m-x479 를 아직
	// 안 고쳤다 — 명시로 최신 고정판을 올려 그걸 덮어쓴다(위 minio 주석 참고).
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
	// S15P21E201-802 — 자연어 여행 도우미가 Google Gemini(무료 티어, gemini-2.5-flash)를 부른다.
	// 공식 Google Gen AI Java SDK. Claude(anthropic-java)에서 이쪽으로 바꿨다 — 크레딧
	// 결제 없이 쓸 수 있어야 한다는 요구가 나중에 생겨서다. 포트/어댑터로 나눠 둔 덕분에
	// 갈아끼운 것은 이 의존성과 adapter 패키지뿐이고, 나머지(도메인·서비스·컨트롤러)는
	// 그대로다.
	implementation 'com.google.genai:google-genai:1.65.0'
	// S15P21E201-835 — 사용자 자유 입력(기록 본문·리뷰 본문 등)을 JSON 응답에 실을 때
	// HTML/JS 로 해석될 수 있는 문자를 인코딩한다(ZAP: Persistent XSS in JSON Response,
	// CWE-79). 손으로 치환 테이블을 짜지 않는 이유 — 컨텍스트별 이스케이프 규칙은
	// 누락되기 쉽고, OWASP 가 관리하는 검증된 구현을 쓰는 것이 이 저장소의 다른 보안
	// 관련 결정(SensitivePayloadGuard 등)과 같은 태도다.
	implementation 'org.owasp.encoder:encoder:1.3.1'
	// S15P21E201-561 — 아웃박스에 쌓인 이벤트를 실제로 브로커에 내보낸다.
	//
	// 버전을 안 적는 이유: Spring Boot 4.0.8 의 의존성 관리가 정한다. 여기에 숫자를 박으면
	// Boot 를 올릴 때 이 줄만 뒤처지고, 그 어긋남은 컴파일이 아니라 기동에서 드러난다.
	//
	// 🔴 이 저장소는 dependencyLocking 이 켜져 있다(위 -680 주석). 의존성을 더한 뒤에는
	//    반드시 `./gradlew dependencies --write-locks` 로 잠금 파일을 다시 쓴다.
	//    안 하면 "Did not resolve … which is locked" 로 빌드가 멈춘다.
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// S15P21E201-779 — TestRestTemplate 은 spring-boot-starter-restclient-test 가 아니라
	// spring-boot-resttestclient 모듈에 있다(실측 — 잡 파일을 직접 훑어 확인했다.
	// org.springframework.boot.resttestclient.TestRestTemplate). restclient-test 는
	// @RestClientTest(아웃바운드 호출을 목킹하는 슬라이스 테스트)용이라 별개다. 이 모듈을
	// 감싸는 starter 가 따로 없어서 직접 적는다.
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	// JUnit 5 · AssertJ · Mockito 한 묶음. 위의 세분화된 *-test 스타터들이 이미 끌어올 수도
	// 있지만, AssertJ 가 있다는 것을 이 파일에서 눈으로 확인할 수 있게 명시한다.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Testcontainers — 테스트가 시작될 때 진짜 PostgreSQL 을 도커 컨테이너로 띄우고 끝나면 지운다.
	// 🔴 H2 로 대신하지 않는 이유: 이 티켓이 저장하는 것이 JSONB · UUID · VARCHAR[] 이고,
	//    그 계약은 PostgreSQL 에서만 진짜로 검증된다. H2 로 통과한 초록은 아무것도 보장하지 않는다.
	//
	// 🔴 BOM(**Bill of Materials — 여러 라이브러리의 버전을 한 줄로 맞춰 주는 목록**)을 직접
	//    가져오는 이유: Spring Boot 4 의 의존성 관리에는 testcontainers 버전이 들어 있지 않다.
	//    버전을 안 적으면 "Could not find org.testcontainers:postgresql:" 로 빌드가 멈춘다.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// S15P21E201-561 — 진짜 브로커를 띄워 Outbox → Kafka → 소비자 경로를 한 번 재현한다.
	// 🔴 임베디드 브로커(spring-kafka-test)를 안 쓰는 이유: 그것은 JVM 안의 흉내라
	//    직렬화·네트워크·오프셋 커밋이 운영과 다르게 동작하는 구석이 있다. 이 시험이
	//    증명하려는 것이 바로 "진짜로 오갔는가" 라서 흉내로는 증명이 안 된다.
	testImplementation 'org.testcontainers:kafka'
	// S15P21E201-367 — S3FileStorage 를 진짜 S3 호환 서버(MinIO) 앞에서 돌려 본다.
	// 운영에서 실제로 쓰는 것과 같은 프로토콜이라, 가짜로 흉내 낸 HTTP 서버보다
	// 서명·버킷 정책 같은 실수를 더 잘 잡는다.
	testImplementation 'org.testcontainers:minio'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// S15P21E201-571 — 계층 규칙(presentation → application → domain ← infra)을 사람이
	// 리뷰에서 놓치지 않고 빌드가 재게 한다.
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// 자바 소스를 어떤 인코딩으로 읽을지를 빌드를 돌리는 기계의 기본값에 맡기지 않는다.
// 윈도우 개발 기계는 보통 MS949 로 읽고 CI 의 리눅스 컨테이너는 UTF-8 로 읽는다. 그 차이를
// 두면 같은 소스가 기계마다 다르게 컴파일되고, 한국어 문자열이 깨진 채로도 컴파일은
// 통과해서 실행할 때서야 드러난다.
//
// 2026-09-04 에 같은 계열의 문제가 설정 파일 쪽에서 실제로 터졌다. 메일 발신자 이름이
// 수신함에서 깨져 나갔고, 원인은 .properties 를 ISO-8859-1 로 읽는 자바 규격이었다
// (DEC-CONFIG-001). 이 설정은 그 사건의 소스 파일 쪽 대응이다.
//
// withType 을 쓰는 이유는 compileJava 와 compileTestJava 를 한 번에 덮기 위해서다.
// 테스트 소스가 빠지면 회귀 테스트 자체가 깨져서 거짓 초록을 낸다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()

	// 🔴 S15P21E201-1217 — 이 줄이 없으면 검사가 **Gradle 기본 힙(512MB)** 으로 돈다.
	//
	//    「힙(heap)」은 자바가 객체를 담는 메모리이고, 그 상한을 안 정하면 Gradle 이
	//    자기 기본값을 준다. 2026-09-18 에 Gradle 에 직접 물어본 값이 이것이었다:
	//
	//      TEST_HEAP :test maxHeapSize=null forkEvery=0 maxParallelForks=1
	//
	//    저장소 어디에도 이 값을 정하는 곳이 없었다 — gradle.properties 는 파일 자체가
	//    없고, -Xmx 는 Jenkinsfile 두 곳뿐인데 그건 운영 컨테이너 런타임용이다.
	//
	//    🔴 forkEvery=0 이 같이 나쁘다. 검사를 도는 자바를 중간에 새로 안 띄운다는
	//    뜻이라, 시험 2,100개를 도는 내내 **한 자바가** 그동안 띄운 스프링 컨텍스트를
	//    전부 들고 있는다. 512MB 로는 빠듯해서 마지막에 OutOfMemoryError 로 죽는다.
	//
	//    ── 🔴 왜 2g 가 아니라 1g 인가 — 2g 로 했다가 더 나쁘게 죽었다 ──────────────
	//
	//    처음에 2g 로 넣었는데 CI 가 **exit 137(SIGKILL)** 로 죽었다. 자바가 자기
	//    한도에 닿은 것이 아니라 **바깥에서 죽임당한 것**이다. 재 보니 이유가 있었다
	//    (2026-09-18, 러너 j15e201a-backup 에서 직접 실측):
	//
	//      기계 전체     15,785MB 중 13,922MB 남음   ← 램은 남아돈다
	//      빌드 컨테이너 HostConfig.Memory = 2GiB      ← 🔴 여기가 진짜 천장이다
	//      스왑          기계에 0                      ← 넘치면 바로 죽는다
	//
	//    🔴 **그 2GiB 한도는 이 저장소에 없다.** .gitlab-ci.yml 에는 메모리 상한 줄이
	//    없고, 러너의 config.toml 이 정한다. 그래서 파일만 읽으면 「상한이 없다」로
	//    보인다 — 실제로 한 번 그렇게 잘못 읽었다. **기계에 램이 남는 것과 이 잡이
	//    쓸 수 있는 것은 다른 숫자다.**
	//
	//    그 2GiB 안에 자바가 **둘** 들어간다 — Gradle 빌드 자바(`--no-daemon` 이라
	//    한 번 쓰고 버리는 것)와 시험 워커 자바. 시험 워커에 2g 를 주면 그 하나가
	//    컨테이너 천장을 통째로 먹어서 둘이 못 들어간다.
	//
	//    1g 은 그 둘이 들어가면서 512MB 의 두 배를 주는 값이다. **상한이지 예약이
	//    아니므로** 512MB 로 충분한 실행은 그만큼만 쓴다.
	//
	//    ── 더 나은 고침은 이 저장소 밖에 있다 ─────────────────────────────────────
	//
	//    기계에 13.9GB 가 남는데 잡이 2GiB 만 쓴다. 러너의 config.toml 에서 그 상한을
	//    올리는 것이 진짜 여유를 주는 길인데, 그건 **저장소가 아니라 러너 설정**이라
	//    여기서 못 한다. 그쪽이 올라가면 이 값도 같이 올릴 수 있다.
	//
	//    ── forkEvery 는 일부러 안 건드린다 ─────────────────────────────────────
	//
	//    자바를 중간중간 새로 띄우면 메모리는 아껴지지만 **스프링을 매번 다시 올려서**
	//    빌드가 몇 배 느려진다. 메모리를 아끼고 시간을 버리는 맞바꿈이라 안 한다.
	//
	//    🔴 이 자리는 **모두의 검사 실행이 바뀌는 자리**라 티켓을 따로 팠다
	//    (아래 clickSim 주석이 같은 이유로 이 파일 수정을 한 번 피했던 기록이다).
	maxHeapSize = '1g'

	testLogging {
		// 🔴 원인 메시지("No qualifying bean of type ...")가 콘솔에 안 찍혀서 CI 실패의
		//    진짜 이유를 못 읽던 문제 — 예외 클래스+줄번호만 남고 원인 체인 메시지는 잘렸다.
		exceptionFormat = 'full'
		showCauses = true
		showExceptions = true
		showStackTraces = true
	}
}

// 🔴 클릭 시뮬레이터용 순위표를 찍는 도구 — S15P21E201-553. 검사가 아니다.
//
//    처음에는 @Test + @EnabledIfEnvironmentVariable 로 만들었는데, CI 의 "건너뛴 검사 0"
//    관문에 걸렸다. 그 관문은 DB 가 안 뜬 날 전부 건너뛰고도 초록이 되는 것을 막는 자리라
//    예외를 만들면 안 된다. 그래서 검사가 아니라 과제로 돌린다.
//
//    이 파일에 손대는 것을 앞서 한 번 피했었다(시험 JVM 에 -D 를 넘기는 설정). 그때는
//    test {} 를 고치는 것이라 모두의 검사 실행이 바뀌는 변경이었다. 이것은 과제를 하나
//    "더하는" 것이라 기존 동작을 안 건드린다 — 그 차이로 판단이 갈렸다.
//
//    쓰기:
//      CLICKSIM_USERS=../eval/click-sim/data/users.json \
//      CLICKSIM_OUT=../eval/click-sim/data/rankings.json \
//      ./gradlew clickSim
tasks.register('clickSim', JavaExec) {
	group = 'application'
	description = '클릭 시뮬레이터가 읽을 순위표를 진짜 채점기로 찍는다 (S15P21E201-553)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.gabolle.backend.recommendation.simulation.ClickSimRankingHarness'
	// 🔴 환경변수를 그대로 물려준다. 경로를 안 주면 하네스의 기본값이 쓰인다.
	environment System.getenv()
}
