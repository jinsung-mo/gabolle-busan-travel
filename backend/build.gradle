plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gabolle'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// JUnit 5 · AssertJ · Mockito 한 묶음. 위의 세분화된 *-test 스타터들이 이미 끌어올 수도
	// 있지만, AssertJ 가 있다는 것을 이 파일에서 눈으로 확인할 수 있게 명시한다.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Testcontainers — 테스트가 시작될 때 진짜 PostgreSQL 을 도커 컨테이너로 띄우고 끝나면 지운다.
	// 🔴 H2 로 대신하지 않는 이유: 이 티켓이 저장하는 것이 JSONB · UUID · VARCHAR[] 이고,
	//    그 계약은 PostgreSQL 에서만 진짜로 검증된다. H2 로 통과한 초록은 아무것도 보장하지 않는다.
	//
	// 🔴 BOM(**Bill of Materials — 여러 라이브러리의 버전을 한 줄로 맞춰 주는 목록**)을 직접
	//    가져오는 이유: Spring Boot 4 의 의존성 관리에는 testcontainers 버전이 들어 있지 않다.
	//    버전을 안 적으면 "Could not find org.testcontainers:postgresql:" 로 빌드가 멈춘다.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
