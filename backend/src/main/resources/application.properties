spring.application.name=gabolle-backend

# DB가 없는 기본 실행은 health 확인과 공통 컴파일 검증에 사용한다.
# 실제 인증/도메인 실행은 db 또는 dev 프로필로 전환한다.
spring.profiles.default=no-db

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# 메일 발송을 끈 환경에서는 SMTP 연결 실패가 전체 애플리케이션을 DOWN 처리하지 않게 한다.
management.health.mail.enabled=${GABOLLE_MAIL_ENABLED:false}

# SMTP는 gabolle.mail.enabled=true인 환경에서만 사용한다.
gabolle.mail.enabled=false

# ── 추천 로깅 (S15P21E201-543) ────────────────────────────────────────────────
#
# DB를 쓰는 추천·Outbox 빈은 인증과 같은 방식으로 @Profile({"db","dev"})가 가른다.
# no-db 프로필에서는 Repository 빈 자체가 없으므로 이 빈들도 만들어지지 않는다.
#
# 🔴 아래 둘에는 기본값을 두지 않는다. 값이 없으면 추천 요청은 실패로 남아야 한다 —
#    "unknown" 같은 값을 넣는 순간 그 결과가 어느 배포에서 나왔는지 영영 알 수 없게
#    되는데, 데이터는 멀쩡해 보인다. 배포 파이프라인이 다음 환경변수로 주입한다
#    (실제 프로퍼티 정의는 application-dev.properties 에 있다).
#      GABOLLE_SERVICE_VERSION=<빌드 버전, 커밋 해시>
#      GABOLLE_DEPLOYMENT_ENVIRONMENT=local | dev | prod
gabolle.recommendation.default-top-k=10
gabolle.recommendation.event-version=1

# ── 추천 BASELINE 규칙 엔진 버전 (S15P21E201-604) ────────────────────────────
#
# 위 service-version・deployment-environment 와 반대로 아래 넷은 기본값을 둔다.
# 저 둘은 빌드・배포의 성질이라 코드가 알 수 없지만, 아래 넷은 우리 코드(가중치・
# 판정표・온톨로지・제약 정책)의 성질이라 코드와 함께 커밋되고 함께 배포된다 —
# 환경변수가 끼어들 이유가 없다.
#
# 🔴 가중치・판정표(규칙)를 고치면 model-version 을 올린다. 안 올리면 다른 규칙으로
#    나온 결과가 같은 버전 이름으로 남아, 나중에 두 결과를 비교할 방법이 없어진다.
gabolle.recommendation.baseline.model-version=baseline-rule-2026-09-16
gabolle.recommendation.baseline.feature-version=place-feature-2026-09-04
gabolle.recommendation.baseline.ontology-version=code-map-2026-09-04
gabolle.recommendation.baseline.policy-version=constraint-policy-2026-09-04

# ── 취향 다섯 축의 비중 — 설문에서 처음 넣는다 (S15P21E201-1040) ──────────────
#
# 추천 점수 중 「취향이 얼마나 맞나」는 다섯 축을 따로 재서 **가중평균**한다.
# 아래 다섯은 그 평균을 낼 때의 **비율**이다. 총점 가중치가 아니다 — 다섯을 전부 2배로
# 해도 결과가 같다. 취향 그룹이 총점에서 차지하는 몫은 weights.preference-alignment 가
# 따로 정한다 (PreferenceAlignmentWeights javadoc).
#
# 🔴 지금까지 이 다섯 키가 어느 properties 파일에도 없었다. 없으면 전부 기본값 1.0 이고,
#    비율이 다 같으면 가중평균은 단순평균과 같은 값이다. 즉 설문에서 나온 계수가 추천에
#    한 톨도 안 들어가 있었다. 이 커밋은 「잇는」 것이 아니라 「처음 넣는」 것이다.
#
# 값의 출처 — 2026-09-16 설문 실측.
#   응답자 153명 중 주의력 검사를 통과한 139명의 짝 비교 973문항에 로지스틱 회귀
#   (둘 중 하나를 고른 자료에서 무엇이 선택을 갈랐는지 재는 방법)를 돌려 나온 표준화
#   계수의 크기를, 대응하는 네 축에 대해 합이 1이 되도록 나눈 것이다.
#   맞춘 비율 62.1% (찍으면 50%). 부호는 전부 상식과 맞았다.
#   근거 문항 수: 그늘 216 · 유명도 734 · 경사 89 · 붐빔 356.
#
# 🔴 경사는 근거 문항이 89건뿐이라 네 축 중 가장 약하다. 표준오차를 안 냈다 —
#    계수 산출 스크립트(S15P21E201-1042)가 그것을 붙인다.
gabolle.recommendation.baseline.alignment.shade-preference=0.39
gabolle.recommendation.baseline.alignment.locality=0.25
gabolle.recommendation.baseline.alignment.slope-preference=0.21
gabolle.recommendation.baseline.alignment.quietness=0.16

# 🔴 관광지 선호만 0 이다. 설문에 이 축을 묻는 문항이 없어서 비율을 정할 근거가 없다.
#
#    비워 두면 기본값 1.0 이 되고, 그러면 **근거가 하나도 없는 축 하나가 나머지 넷을 합친
#    것(1.01)과 맞먹는 무게**를 갖는다. 안 정하는 것이 가장 나쁜 선택지라 0 으로 끈다.
#
#    「사람들이 관광지를 싫어한다」가 아니라 「이 축은 셈에 넣지 않는다」는 뜻이다.
#    「관광지↔동네」라는 개념 자체는 locality 축이 양 끝을 이미 담고 있어 사라지지 않는다.
#    다섯이 **전부** 0 일 때만 예외가 나므로 하나만 0 은 정상이다(PreferenceAlignmentWeights).
#
#    🔴 지금은 이 값이 동작을 바꾸지 않는다 — TOURIST_RATIO 장소 값이 운영에 0건이라
#       어차피 평균에서 빠진다. 값이 채워지는 날을 대비한 안전장치다.
#       두 축을 합칠지는 마감 뒤에 정한다 (S15P21E201-1041 · -1063).
gabolle.recommendation.baseline.alignment.tourist-preference=0

# ── 후보를 몇 곳이나 보고 몇 곳을 남기나 (S15P21E201-724) ────────────────────
#
# 🔴 이 둘은 뜻이 다르다. 예전에는 하나뿐이었고, 그 하나가 **채점 대상**을 잘랐다.
#
#   candidate-scan-limit : 반경 안에서 **채점할** 후보 수의 상한
#   candidate-limit      : 채점을 마친 뒤 **남길** 후보 수 (= 저장되는 행 수)
#
# 부산은 반경 5km 안에 음식점만 평균 9,422곳이 있다. 예전처럼 200 으로 잘라 놓고
# 채점하면 실효 반경이 중앙값 304m 가 된다 — 반경을 5km 로 잡아 놓고 300m 를 보는 것이다.
# 그 밖의 장소는 아무리 취향에 맞아도 점수를 매길 기회조차 없었다.
#
# 느리면 scan-limit 을 내린다. 내리는 만큼 "안 보는 장소" 가 다시 생긴다는 것이 대가다.
# DB 에서 실제로 읽어 오는 행 수는 gabolle.place.candidate-max-scanned 가 따로 막는다.
gabolle.recommendation.baseline.candidate-scan-limit=20000
gabolle.recommendation.baseline.candidate-limit=200

# 추천 후보 사전 필터가 경계상자에서 읽어 올 최대 행 수. 넘으면 자르고 경고 로그를 남긴다.
# 🔴 근처 조회(gabolle.place.nearby-max-scanned)와 다른 값이다 — 저쪽은 사람이 보는 목록이고
#    이쪽은 채점 대상 전체다.
gabolle.place.candidate-max-scanned=20000

# 🔴 확인하지 못한(UNKNOWN) 제약이 어느 등급 이상일 때 그 후보를 결과에서 뺄 것인가.
#    REQUIRED | PREFERRED | OPTIONAL | NONE
#
#    기본값 REQUIRED — 알레르기·필수 접근성처럼 확인 못 하면 위험한 조건만 뺀다.
#    "확인 필요" 경고는 사용자가 대신 확인할 수 있을 때만 정보이고, 그렇지 않으면
#    책임 전가다. 그늘·경사 같은 선호 조건의 미확인은 경고를 달고 그대로 내보낸다.
#
#    🔴 이 기본값은 기능·화면 상세설계서 FR-REC-02("제외하지 않고 경고")와 반대 방향이다.
#       REC/AI 확인 후 확정한다. 되돌리려면 이 값을 NONE 으로 바꾸면 된다.
gabolle.recommendation.unknown-exclusion-threshold=REQUIRED

# 온톨로지가 severity 없이 보낸 미확인 사실을 무엇으로 볼 것인가. REQUIRED | PREFERRED | OPTIONAL
#
# 🔴 기본값 REQUIRED — 없는 값을 낙관적으로 채우지 않는다. 대가가 있다: 온톨로지가 아직
#    severity 를 안 실어 보내는 동안에는 미확인 후보가 전부 빠져 후보가 말라붙는다.
gabolle.recommendation.unspecified-severity=REQUIRED

# ── 여행 기록 사진 저장소 (S15P21E201-216 · -370 · -174 · -367) ────────────────
#
# 사진은 데이터베이스에 넣지 않는다. 파일은 StoragePort 뒤의 저장소에 있고 표에는 주소만 있다.
# 🔴 -367(2026-09-08) 결정 — 오브젝트 스토리지는 새 업체 가입 없이 personalization
#    파이프라인이 이미 쓰던 MinIO 를 재사용한다. 근거는 StorageProperties 클래스 주석과
#    infra/personalization/compose.yaml 의 -367 주석.
#
# 기본은 여전히 local(M1, 서버 디스크) 이다 — GABOLLE_STORAGE_PROVIDER 를 안 주면 지금까지와
# 같은 동작이다. s3 로 바꾸려면 GABOLLE_STORAGE_PROVIDER=s3 와 아래 s3.* 값을 함께 준다.
gabolle.storage.provider=${GABOLLE_STORAGE_PROVIDER:local}

# 🔴 컨테이너 안의 상대 경로는 재배포하면 사라진다. 운영은 GABOLLE_STORAGE_ROOT 를 볼륨으로
#    마운트한 절대 경로로 줘야 사진이 배포를 넘어 남는다(Jenkinsfile 의 docker run 에 -v 와 -e).
#    기본값을 둔 이유는 값이 없다고 서버가 안 뜨는 것이 더 나쁘기 때문이다(INC-DEPLOY-001).
#    provider=local 일 때만 쓰인다.
gabolle.storage.root=${GABOLLE_STORAGE_ROOT:./data/uploads}
# 공개 주소 접두어. 주소 = 접두어 + "/" + 저장 키. SecurityConfig 가 이 경로의 GET 을 인증 없이 연다.
# provider=local 일 때만 쓰인다.
gabolle.storage.public-base-path=/api/v1/uploads/images

# provider=s3 일 때만 쓰인다. 기본값을 전부 빈 문자열로 두는 이유는 SecurityAlertProperties 와
# 같다 — provider=local 인 배포(대부분)에서 이 값이 없다고 기동이 막히면 안 된다.
gabolle.storage.s3.endpoint=${GABOLLE_S3_ENDPOINT:}
gabolle.storage.s3.bucket=${GABOLLE_S3_BUCKET:}
gabolle.storage.s3.access-key=${GABOLLE_S3_ACCESS_KEY:}
gabolle.storage.s3.secret-key=${GABOLLE_S3_SECRET_KEY:}
# 예: https://j15e201.p.ssafy.io/photos — EC2 nginx 가 이 경로를 MinIO 로 프록시한다.
gabolle.storage.s3.public-base-url=${GABOLLE_S3_PUBLIC_BASE_URL:}
# 🔴 비워 두면 안 된다 — SDK 가 버킷 위치를 서버에 묻고 권한이 없어 403 으로 죽는다.
#    기본값은 MinIO 의 기본 지역이다. 진짜 AWS S3 로 옮기면 그 버킷의 지역을 넣는다.
gabolle.storage.s3.region=${GABOLLE_S3_REGION:us-east-1}
# 🔴 상한은 층이 넷이고 순서가 규칙이다 — 아래 층이 위 층보다 크면 그 층의 오류가 영영 안 나온다.
#
#      앱  <  gabolle.storage.video.max-bytes  <  multipart  <  nginx(운영 5MB)
#
# 🔴 「작거나 같다」가 아니라 「작다」이다. 같으면 바깥 층이 먼저 자르고, 안쪽 층이 준비한
#    설명 있는 오류가 한 번도 안 쓰인다. 특히 nginx 가 막으면 요청이 Spring 에 닿지도 않아
#    백엔드 로그에 아무것도 안 남는다 — docs/SERVER-SETUP.md 「업로드 크기 상한」.
#
# 🔴 사진은 이 값과 무관하게 UploadedImage.MAX_BYTES(3MB)가 도메인에서 막는다. 그래서 아래를
#    올려도 사진이 커지지 않는다 — 오히려 Spring 의 밋밋한 오류 대신 설명 있는 413 이 나간다.
# 🔴 4MB/4608KB 는 운영 nginx 5MB 안에서 동영상이 통하게 하는 값이지 실측값이 아니다.
#    4608KB(=4.5MB)는 nginx 5MB 와 같지 않게 하려고 고른 값이다 — 같으면 nginx 가 먼저 자른다.
#    실측 뒤에는 nginx 를 포함해 네 층을 함께 올리되 층마다 여유를 남긴다.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4608KB

# 동영상 한 개의 최대 바이트 (S15P21E201-1275). 3MB.
# 🔴 실측값이 아니다. 앱이 줄여서 보내므로(2026-09-18 결정 — 줄이기·썸네일·길이 재기를 전부
#    앱이 한다) 「1분이 몇 MB 인가」를 실기기에서 재 본 뒤에 정한다.
# 🔴 이 값이 사슬에서 가장 작아야 한다. 그래야 넘쳤을 때 도메인이 말한다 — 응답에
#    maxBytes 가 실리고 사용자가 얼마까지 되는지 안다.
#    위 multipart(4MB)와 같게 두면 안 된다. 같으면 multipart 가 먼저 자르고 그 값이 안 실린다.
gabolle.storage.video.max-bytes=${GABOLLE_VIDEO_MAX_BYTES:3145728}

# ── 개인정보 자동 정리 배치 (S15P21E201-357 · -166) ──────────────────────────
#
# 🔴 기본은 꺼짐이다. 운영에 처음 올릴 때는 값을 검토(특히 보관 기간 — PrivacyCleanupProperties
#    클래스 주석 참고, F-SYS-07 확정값 미확인 상태의 잠정값이다)한 뒤 GABOLLE_PRIVACY_CLEANUP_ENABLED
#    를 true 로 켠다. 알림 웹훅을 안 주면(기본) 실패가 로그와 privacy_cleanup_run 표에만 남는다.
gabolle.privacy.cleanup.enabled=${GABOLLE_PRIVACY_CLEANUP_ENABLED:false}
gabolle.privacy.cleanup.alert-webhook-url=${GABOLLE_PRIVACY_CLEANUP_ALERT_WEBHOOK_URL:}
# 🔴 2026-09-08 사고(S15P21E201-357 배포 실패, 이 파일 다음 줄이 원래 빠져 있었다) — @Scheduled의
#    cron 속성은 ${...} 자리표시자를 PrivacyCleanupProperties의 자바 기본값이 아니라 이 프로퍼티
#    소스에서 직접 찾는다. 여기 없으면 "Could not resolve placeholder"로 기동 자체가 죽는다
#    (@ConfigurationProperties 바인딩과 @Scheduled의 플레이스홀더 해석은 서로 다른 경로다).
#    PrivacyCleanupProperties의 기본값과 반드시 같은 값으로 유지한다.
gabolle.privacy.cleanup.cron=${GABOLLE_PRIVACY_CLEANUP_CRON:0 0 19 * * *}

# 메뉴판 호출 기록 청소 (S15P21E201-1038) — 하루 지난 행을 쓸어 간다.
# 위 사고와 같은 규약을 따른다. MenuScanUsageSweeper 의 @Scheduled 에도 같은 기본값을
#    인라인으로 적어 뒀지만, 그 인라인만 믿지 않고 여기에도 둔다 — 누가 인라인 기본값을
#    빼는 순간 위 주석이 적은 것과 똑같이 기동이 죽는다. 두 값은 반드시 같게 유지한다.
# 개인정보 청소(19:00 UTC)와 시각을 겹치지 않게 뒀다. 같은 시각에 두 삭제가 돌면
#    느려지는 이유를 나중에 로그만 보고 가려내기 어렵다.
gabolle.menu-scan.usage-cleanup.cron=${GABOLLE_MENU_SCAN_USAGE_CLEANUP_CRON:0 20 18 * * *}

# 고아 업로드 청소 (S15P21E201-1284) — 어디에도 안 붙은 파일을 치운다.
#
# 🔴 기본이 「끄기」가 아니라 「세기만 하기」다. false 여도 청소기는 돌면서
#    「지웠을 것 N개」를 로그에 남긴다. 며칠 그 숫자를 보고 나서 true 로 켠다 —
#    파일 삭제는 되돌릴 수 없고, 되돌릴 수 없는 일은 먼저 세어 보고 한다.
gabolle.storage.orphan-cleanup.enabled=${GABOLLE_ORPHAN_CLEANUP_ENABLED:false}
# 🔴 위 개인정보 정리 사고와 같은 규약 — @Scheduled 의 cron 자리표시자는 자바 기본값이 아니라
#    이 프로퍼티 소스에서 찾는다. OrphanUploadSweeper 의 인라인 기본값과 반드시 같게 유지한다.
#    개인정보 정리(19:00)·메뉴판 청소(18:20)와 시각을 겹치지 않게 뒀다.
gabolle.storage.orphan-cleanup.cron=${GABOLLE_ORPHAN_CLEANUP_CRON:0 40 18 * * *}

# ── 경로 최적화(OR-Tools, 파이썬) 실행 환경 (S15P21E201-161) ──────────────────
#
# 자바가 아니라 backend/solver/route_optimizer.py 서브프로세스를 부른다. 기본값은
# 로컬 개발 PC 를 겨눈다 — PATH 의 python3 에 ortools 를 직접 깔아 뒀다고 가정한다.
# 배포 이미지·CI 는 각각 Dockerfile·.gitlab-ci.yml 이 GABOLLE_ROUTE_OPTIMIZER_PYTHON
# 으로 덮어쓴다 — 실행 이미지 apt 의 python3(3.14)에는 ortools 휠이 없어서다.
gabolle.route-optimizer.python-executable=${GABOLLE_ROUTE_OPTIMIZER_PYTHON:python3}
gabolle.route-optimizer.script-path=${GABOLLE_ROUTE_OPTIMIZER_SCRIPT:solver/route_optimizer.py}
gabolle.route-optimizer.timeout-seconds=${GABOLLE_ROUTE_OPTIMIZER_TIMEOUT_SECONDS:5}

# ── 내부 배치 API (MLOps Phase 1) ───────────────────────────────────────────
#
# 🔴 기본값이 빈 문자열이고, 그것이 의도다. 비어 있으면 InternalTokenAuthenticationFilter
#    가 아무 권한도 심지 않아 /internal/** 이 전부 거부된다 — "설정을 깜빡했더니 인증
#    없이 열려 있었다" 가 되지 않는다. 배치가 멈추는 것은 시끄럽고, 문이 열려 있는
#    것은 조용하다.
#
# 🔴 값을 이 파일에 적지 않는다. 적으면 git 에 들어간다. 환경변수로 넣는다:
#      GABOLLE_INTERNAL_API_TOKEN=<`openssl rand -hex 32` 로 만든 값>
gabolle.internal-api.token=${GABOLLE_INTERNAL_API_TOKEN:}

# 코스 테마 — S15P21E201-450.
#
# 테마는 만들면서 계속 손보는 값이라 코드가 아니라 여기에 둔다. 값을 고치면 같은 산출물로
# 반영된다 — 다만 서버를 다시 시작해야 읽는다(재시작 없이 바뀌게 하는 것은 별개의 일이다).
#
# 순서가 화면의 순서다. 코드는 대문자와 밑줄만 쓴다.
#
# 티켓이 이름을 적어 둔 것은 여섯이고(ZERO_WON · BEST_BANG · SPLURGE · OLD_TOWN ·
# NATURE_FIX · PICTURE_PERFECT) 나머지 넷은 "외 4종" 으로만 적혀 있었다. 아래 넷
# (FOOD_CRAWL · NIGHT_VIEW · RAINY_DAY · SLOW_WALK)은 제안이고 확정이 아니다. 화면이
# 이 코드를 그대로 쓰게 되므로 확정 전에 이름이 바뀌면 양쪽을 함께 고쳐야 한다.
