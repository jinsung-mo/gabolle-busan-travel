# ── 취향 벡터 접기 배치 (MLOps Phase 1) ─────────────────────────────────────
#
# 위의 baseline 버전 넷과 같은 성질이다 — 접는 산수가 우리 코드에 있으니 코드와 함께
# 커밋되고 함께 배포된다. 그래서 환경변수가 아니라 여기 적는다.
#
# 🔴 접는 산수를 고치면 vector-version 을 올린다. 안 올리면 다른 규칙으로 접은 벡터가
#    같은 이름으로 남아서, 두 사람의 벡터가 같은 잣대로 만들어진 것인지 알 수 없게 된다.
#    그러면 비교 자체가 무의미해지는데 데이터는 멀쩡해 보인다.
#
# 🔴 ontology-version 은 추천 쪽 baseline.ontology-version 과 **같은 값이어야 한다.**
#    둘 다 user_place_code_map(취향 코드 ↔ 장소 피처 대조표)을 가리키기 때문이다.
#    어긋나면 "이 벡터는 어느 대조표로 접혔나" 의 답이 두 개가 된다.
gabolle.taste-vector.vector-version=survey-fold-2026-09-08
gabolle.taste-vector.ontology-version=code-map-2026-09-04
