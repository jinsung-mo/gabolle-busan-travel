# 실제 값은 환경변수/시크릿으로 주입한다. 저장소에 비밀값을 넣지 않는다.
spring.datasource.url=${GABOLLE_DB_URL}
spring.datasource.username=${GABOLLE_DB_USERNAME}
spring.datasource.password=${GABOLLE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# 백엔드 소유 테이블은 개인화 파이프라인의 public schema와 분리한다.
# 운영에서는 이 schema를 DB 관리자가 먼저 만들고 app_user에게 권한을 준다.
spring.flyway.schemas=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.default-schema=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.create-schemas=false
spring.jpa.properties.hibernate.default_schema=${GABOLLE_DB_SCHEMA:gabolle}
# 🔴 위 default_schema 는 Hibernate 가 **생성하는** SQL 에만 걸린다.
#    nativeQuery=true 로 손으로 쓴 SQL 은 그대로 나가고, 연결의 search_path 로 표를 찾는다.
#    JDBC URL 에 currentSchema 가 없고 app_user 에도 search_path 가 없어서 기본값
#    ("", public)이 되고, 표는 gabolle 에만 있으니 "relation does not exist" 로 죽는다.
#    아래 한 줄은 **연결 자체**에 스키마를 걸어서 두 종류의 SQL 을 모두 덮는다.
#    🔴 테스트로는 안 잡힌다 — 시험용 DB 는 스키마가 하나뿐이라 어느 쪽을 봐도 찾아진다.
#    docs/DB-STANDARD.md 2절에 같은 사고가 이미 적혀 있다 (S15P21E201-546 / MR !115).
spring.datasource.hikari.schema=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.enabled=true

spring.mail.host=${GABOLLE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${GABOLLE_MAIL_PORT:587}
# 빈 기본값을 둔다 — 자리표시자가 안 풀리면 메일과 무관한 이유로 기동이 깨진다.
# 값이 정말 필요한 경우(gabolle.mail.enabled=true)는 SmtpEmailSender 가 기동에서 막는다.
spring.mail.username=${GABOLLE_MAIL_USERNAME:}
spring.mail.password=${GABOLLE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
gabolle.mail.enabled=${GABOLLE_MAIL_ENABLED:false}
gabolle.mail.from=${GABOLLE_MAIL_FROM:${GABOLLE_MAIL_USERNAME:}}
# 받는 사람에게 보이는 발신자 이름. 이게 없으면 Gmail 주소가 그대로 노출된다.
#
# \uAC00\uBCFC\uB798 는 가볼래 다. 한글을 그대로 쓰면 안 된다 — .properties 파일은
# Java 규격상 ISO-8859-1 로 읽히므로 UTF-8 로 저장한 한글이 바이트 단위로
# 잘못 해석된다. 2026-09-04 에 실제로 발신자가 ê°ë³¼ë 로 나갔다.
# 이 파일 안에서는 이 이스케이프가 읽는 쪽 인코딩과 무관한 유일한 표기다.
gabolle.mail.from-name=${GABOLLE_MAIL_FROM_NAME:\uAC00\uBCFC\uB798}

gabolle.auth.jwt-secret=${GABOLLE_JWT_SECRET}
# 로그인 유지 시간 — S15P21E201-739. 사용자가 체감하는 값은 접속 표(30분)가 아니라 이쪽이다.
# 갱신할 때마다 만료가 다시 밀리므로 "쓰지 않고 이만큼 지나면 로그아웃" 으로 읽는다.
# 배포에서 되돌릴 수 있어야 해서 환경 변수로 받는다 — 시연 중에 튕기면 이 값만 늘린다.
gabolle.auth.refresh-token-ttl=${GABOLLE_REFRESH_TOKEN_TTL:2h}
# S15P21E201-941 — 메일 링크가 화면 주소로 간다. 사람이 받는 링크에 api·v1 이 보이면
# 주소만 보고 무엇인지 알 수 없고, 눌러도 인증이 끝났다는 말을 아무도 안 해 준다.
# 화면(app/auth/email/verify.tsx)이 토큰을 받아 확인 API 를 부르고 결과를 보여 준다.
# 비밀번호 재설정이 이미 같은 모양이다(아래 password-reset-base-url).
gabolle.auth.email-verification-base-url=${GABOLLE_EMAIL_VERIFICATION_BASE_URL:https://j15e201.p.ssafy.io/auth/email/verify}
# 이미 나간 메일의 옛 링크는 백엔드 GET 경로로 그대로 온다. 그 경로가 끝낸 뒤 보내는 자리도
# 같은 화면이라 두 경우가 한 화면에서 끝난다 — done 이 붙어 오면 화면은 확인 API 를 부르지 않는다.
gabolle.auth.email-verification-success-redirect-url=${GABOLLE_EMAIL_VERIFICATION_SUCCESS_URL:https://j15e201.p.ssafy.io/auth/email/verify?done=1}
gabolle.auth.email-verification-failure-redirect-url=${GABOLLE_EMAIL_VERIFICATION_FAILURE_URL:https://j15e201.p.ssafy.io/auth/email/verify?done=0}
# 🔴 프런트의 실제 착지 화면은 app/auth/password/reset.tsx 이고 경로가 /auth/password/reset 이다.
# 이 값에 "?token=<원문토큰>" 이 붙는다. 이전 기본값 localhost:3000/reset-password 는 존재하지
# 않는 화면이어서 재설정 메일의 링크가 아무 데도 닿지 않았다.
gabolle.auth.password-reset-base-url=${GABOLLE_PASSWORD_RESET_BASE_URL:https://j15e201.p.ssafy.io/auth/password/reset}
# 재설정 링크 유효 시간. S15P21E201-433 의 완료 기준이 30분이다.
gabolle.auth.password-reset-ttl=${GABOLLE_PASSWORD_RESET_TTL:30m}
gabolle.auth.oauth-allowed-redirect-uris=${GABOLLE_OAUTH_ALLOWED_REDIRECT_URIS:https://j15e201.p.ssafy.io/oauth/google/callback,https://j15e201.p.ssafy.io/oauth/naver/callback,https://j15e201.p.ssafy.io/oauth/kakao/callback,https://j15e201.p.ssafy.io/oauth/apple/callback,https://j15e201.p.ssafy.io/api/v1/auth/oauth/apple/form-post}
# 🔴 위 목록의 마지막 항목은 애플만 쓰는 서버 주소다 — S15P21E201-833. 애플에 이메일을
#    요청하면 결과가 POST 로 오고 정적 화면은 그것을 못 받으므로, 애플의 redirect_uri 만
#    서버 경로로 둔다. 코드 교환은 인증 요청에 쓴 redirect_uri 와 글자까지 같은 값을
#    요구하므로 이 목록에 없으면 챌린지 발급이 400 으로 거부된다.
#    앞의 화면 주소 넷은 그대로 둔다 — 애플도 이 값이 배포에 반영되기 전까지 옛 경로로 돈다.
gabolle.auth.apple-form-post-redirect-url=${GABOLLE_APPLE_FORM_POST_REDIRECT_URL:https://j15e201.p.ssafy.io/oauth/apple/callback}
gabolle.auth.cors-allowed-origins=${GABOLLE_CORS_ALLOWED_ORIGINS:https://j15e201.p.ssafy.io}
gabolle.auth.web-refresh-cookie-name=${GABOLLE_WEB_REFRESH_COOKIE_NAME:gabolle_refresh_token}
gabolle.auth.web-refresh-cookie-secure=${GABOLLE_WEB_REFRESH_COOKIE_SECURE:true}
gabolle.auth.web-refresh-cookie-same-site=${GABOLLE_WEB_REFRESH_COOKIE_SAME_SITE:Strict}
gabolle.auth.one-time-token-request-cooldown=${GABOLLE_AUTH_REQUEST_COOLDOWN:60s}
gabolle.auth.oauth-challenge-ttl=${GABOLLE_OAUTH_CHALLENGE_TTL:5m}
gabolle.auth.age-gate-policy-version=${GABOLLE_AGE_GATE_POLICY_VERSION:2026-01}
gabolle.auth.consent-policy-version=${GABOLLE_CONSENT_POLICY_VERSION:2026-01}

# 기동할 때 운영자(ADMIN)로 올릴 계정의 이메일 (S15P21E201-225). 쉼표로 여러 개.
#
# 🔴 여기에 계정을 미리 적어 두지 않는다. 값이 비면 아무도 운영자가 아니고, 그것이
# 정상 상태다. 한 명이라도 박아 두면 그 배포에서는 아무 확인 없이 그 사람이 신고 검토
# 큐를 연다 — "설정이 없으면 편의상 기본값을 쓴다" 가 보안 구멍이 되는 자리가 여기다.
# 그래서 위의 다른 값들과 달리 실제 값을 담은 기본값이 없고, 빈 값만 있다.
#
# 적은 이메일의 계정이 없으면 기동이 실패한다. 오타 하나로 "운영자를 지정했다고
# 생각했는데 아무도 없는" 상태가 조용히 유지되는 것을 막는다.
#
# 목록에서 빠진 계정은 다음 기동에서 USER 로 내려간다. 이 설정이 유일한 사실이다.
#
# 이 값을 실제로 넘기려면 Jenkinsfile 의 Deploy 단계에 -e GABOLLE_ADMIN_EMAILS 를
# 더해야 한다. 아직 안 더했다 — 지금은 운영자가 없는 상태로 뜬다.
gabolle.auth.admin-emails=${GABOLLE_ADMIN_EMAILS:}

gabolle.oauth.google.client-id=${GABOLLE_GOOGLE_CLIENT_ID:}
gabolle.oauth.google.client-secret=${GABOLLE_GOOGLE_CLIENT_SECRET:}
gabolle.oauth.google.allowed-client-ids=${GABOLLE_GOOGLE_ALLOWED_CLIENT_IDS:}
gabolle.oauth.google.issuer=${GABOLLE_GOOGLE_ISSUER:https://accounts.google.com}
gabolle.oauth.google.jwk-set-uri=${GABOLLE_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
gabolle.oauth.naver.client-id=${GABOLLE_NAVER_CLIENT_ID:}
gabolle.oauth.naver.client-secret=${GABOLLE_NAVER_CLIENT_SECRET:}
gabolle.oauth.kakao.client-id=${GABOLLE_KAKAO_CLIENT_ID:}
gabolle.oauth.kakao.client-secret=${GABOLLE_KAKAO_CLIENT_SECRET:}

# Sign in with Apple (S15P21E201-825).
#
# 🔴 앞의 셋과 달리 client secret 자리에 넣을 문자열이 없다. 애플은 우리가 서명한 JWT 를 요구하고,
# 서버가 team-id · key-id · private-key 로 그것을 만든다(AppleClientSecretFactory). 그래서 값이
# 셋이고, 하나라도 비면 애플 로그인만 501 로 답한다 — 나머지 소셜 로그인은 그대로 돈다.
#
# private-key 는 개발자 계정에서 한 번 내려받는 .p8 파일의 내용 전체다. 환경변수로 넘길 때 줄바꿈이
# \n 두 글자로 바뀌어도 읽도록 해 두었다.
#
# allowed-client-ids 는 웹과 앱의 대상이 다르기 때문에 있다. 웹 로그인은 Service ID 로, iOS 앱의
# 네이티브 로그인은 앱 번들 id 로 토큰이 발급된다. 앱을 붙일 때 번들 id 를 여기에 더한다.
gabolle.oauth.apple.client-id=${GABOLLE_APPLE_CLIENT_ID:}
gabolle.oauth.apple.allowed-client-ids=${GABOLLE_APPLE_ALLOWED_CLIENT_IDS:}
gabolle.oauth.apple.team-id=${GABOLLE_APPLE_TEAM_ID:}
gabolle.oauth.apple.key-id=${GABOLLE_APPLE_KEY_ID:}
gabolle.oauth.apple.private-key=${GABOLLE_APPLE_PRIVATE_KEY:}
gabolle.oauth.apple.client-secret-ttl-days=${GABOLLE_APPLE_CLIENT_SECRET_TTL_DAYS:90}
gabolle.oauth.apple.issuer=${GABOLLE_APPLE_ISSUER:https://appleid.apple.com}
gabolle.oauth.apple.jwk-set-uri=${GABOLLE_APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}

# 🔴 빈 기본값(`:`)을 두는 것이 의도다. 값이 없으면 추천 요청만 실패하고 애플리케이션
# 기동은 된다 — S15P21E201-604 의 완료 기준이 그것을 명시적으로 요구한다.
#
# 한 번 반대로 만들었다가 되돌렸다. 기본값 없이 두면 값이 빠졌을 때 기동이 멈춰서
# 배포 설정 문제라는 게 그 자리에서 드러나는 이점이 있는데, 대가가 너무 크다 —
# 이 저장소는 기동 실패로 이미 세 번 운영이 멈췄다(INC-DEPLOY-001). 추천 하나 때문에
# 인증·장소·여행까지 전부 못 쓰게 되는 것은 맞바꿀 만한 거래가 아니다.
#
# 값이 실제로 넘어가는지는 다른 곳이 지킨다. DevProfilePlaceholderTest 가 이 파일의
# 모든 ${VAR} 를 Jenkins 가 넘기는 목록으로 풀어 보고, 목록에서 하나가 빠지면 그
# 테스트가 먼저 빨개진다. 값이 비면 추천 작업은 VERSION_UNRESOLVED 로 실패하고
# 그 이유가 recommendation_job.error_code 에 남는다.
gabolle.recommendation.service-version=${GABOLLE_SERVICE_VERSION:}
gabolle.recommendation.deployment-environment=${GABOLLE_DEPLOYMENT_ENVIRONMENT:}

# ── 경로 조회 (S15P21E201-184 · -189 · -196) ────────────────────────────────
#
# 🔴 카카오는 앱 하나에 REST API 키를 **하나만** 준다. 위의 로그인용 client-id 와 길찾기·
#    장소검색에 쓰는 키가 같은 값이다 — 우연이 아니라 카카오가 그렇게 설계했다(Jenkinsfile
#    머리말에도 "Kakao 는 REST API 키가 client_id 다" 라고 적혀 있다).
#
#    그래서 새 자격증명을 만들지 않고 그 값을 물려받는다. 나중에 로그인 앱과 지도 앱을
#    나누게 되면 GABOLLE_KAKAO_REST_API_KEY 만 따로 주면 되고, 이 줄은 안 고쳐도 된다.
#
#    빈 값이어도 기동은 된다 — 그때는 실제 경로 대신 직선거리 추정으로 답한다.
gabolle.route.kakao-rest-api-key=${GABOLLE_KAKAO_REST_API_KEY:${GABOLLE_KAKAO_CLIENT_ID:}}

# 출발지 검색(S15P21E201-434)도 같은 키를 쓴다. 이 줄이 없어서 지금까지 카카오를 부르지
# 못하고 대체 목록으로 내려갔는데, 그 대체 목록이 뒤지는 place 표가 비어 있어서 결과가
# **항상 0건**이었다. 키는 이미 배포에 들어가 있으므로 이 한 줄이면 살아난다.
gabolle.place.origin.kakao-rest-api-key=${GABOLLE_KAKAO_REST_API_KEY:${GABOLLE_KAKAO_CLIENT_ID:}}

# 번역 중계(S15P21E201-343). 아직 실제 번역 업체 계약이 없다 — 키·엔드포인트가 비어 있으면
# 기동은 되지만 호출 자체가 명확한 실패(TRANSLATE_VENDOR_NOT_CONFIGURED, 502)로 끝난다.
# 미리 정해 둔 문장으로 대신 답하지 않는다.
gabolle.tools.translate.vendor-api-key=${GABOLLE_TRANSLATE_API_KEY:}
gabolle.tools.translate.vendor-base-url=${GABOLLE_TRANSLATE_BASE_URL:}

# 기상청 단기예보 조회(S15P21E201-366). 공공데이터포털에서 발급받는 인증키다. 비어 있으면
# 기동은 되지만 호출 자체가 명확한 실패(WEATHER_VENDOR_NOT_CONFIGURED, 502)로 끝난다 —
# 지어낸 기온·강수확률로 대신 답하지 않는다.
gabolle.weather.kma-service-key=${GABOLLE_KMA_SERVICE_KEY:}

# 자연어 여행 도우미(S15P21E201-802). 키가 비어 있으면 기동은 되지만 호출 자체가 명확한
# 실패(ASSISTANT_VENDOR_NOT_CONFIGURED, 502)로 끝난다 — translate 와 같은 규칙이다.
gabolle.assistant.api-key=${GABOLLE_ASSISTANT_API_KEY:}
