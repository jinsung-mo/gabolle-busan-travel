# 실제 값은 환경변수/시크릿으로 주입한다. 저장소에 비밀값을 넣지 않는다.
spring.datasource.url=${GABOLLE_DB_URL}
spring.datasource.username=${GABOLLE_DB_USERNAME}
spring.datasource.password=${GABOLLE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# 백엔드 소유 테이블은 개인화 파이프라인의 public schema와 분리한다.
# 운영에서는 이 schema를 DB 관리자가 먼저 만들고 app_user에게 권한을 준다.
spring.flyway.schemas=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.default-schema=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.create-schemas=false
spring.jpa.properties.hibernate.default_schema=${GABOLLE_DB_SCHEMA:gabolle}
spring.flyway.enabled=true

spring.mail.host=${GABOLLE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${GABOLLE_MAIL_PORT:587}
spring.mail.username=${GABOLLE_MAIL_USERNAME}
spring.mail.password=${GABOLLE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
gabolle.mail.enabled=${GABOLLE_MAIL_ENABLED:false}
gabolle.mail.from=${GABOLLE_MAIL_FROM:${GABOLLE_MAIL_USERNAME}}

gabolle.auth.jwt-secret=${GABOLLE_JWT_SECRET}
gabolle.auth.email-verification-base-url=${GABOLLE_EMAIL_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}
gabolle.auth.password-reset-base-url=${GABOLLE_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
gabolle.auth.oauth-allowed-redirect-uris=${GABOLLE_OAUTH_ALLOWED_REDIRECT_URIS:https://j15e201.p.ssafy.io/oauth/google/callback}
gabolle.auth.cors-allowed-origins=${GABOLLE_CORS_ALLOWED_ORIGINS:https://j15e201.p.ssafy.io}
gabolle.auth.web-refresh-cookie-name=${GABOLLE_WEB_REFRESH_COOKIE_NAME:gabolle_refresh_token}
gabolle.auth.web-refresh-cookie-secure=${GABOLLE_WEB_REFRESH_COOKIE_SECURE:true}
gabolle.auth.web-refresh-cookie-same-site=${GABOLLE_WEB_REFRESH_COOKIE_SAME_SITE:Strict}
gabolle.auth.one-time-token-request-cooldown=${GABOLLE_AUTH_REQUEST_COOLDOWN:60s}
gabolle.auth.oauth-challenge-ttl=${GABOLLE_OAUTH_CHALLENGE_TTL:5m}
gabolle.auth.age-gate-policy-version=${GABOLLE_AGE_GATE_POLICY_VERSION:2026-01}
gabolle.auth.consent-policy-version=${GABOLLE_CONSENT_POLICY_VERSION:2026-01}

gabolle.oauth.google.client-id=${GABOLLE_GOOGLE_CLIENT_ID:}
gabolle.oauth.google.client-secret=${GABOLLE_GOOGLE_CLIENT_SECRET:}
gabolle.oauth.google.allowed-client-ids=${GABOLLE_GOOGLE_ALLOWED_CLIENT_IDS:}
gabolle.oauth.google.issuer=${GABOLLE_GOOGLE_ISSUER:https://accounts.google.com}
gabolle.oauth.google.jwk-set-uri=${GABOLLE_GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
gabolle.oauth.naver.client-id=${GABOLLE_NAVER_CLIENT_ID:}
gabolle.oauth.naver.client-secret=${GABOLLE_NAVER_CLIENT_SECRET:}
gabolle.oauth.kakao.client-id=${GABOLLE_KAKAO_CLIENT_ID:}
gabolle.oauth.kakao.client-secret=${GABOLLE_KAKAO_CLIENT_SECRET:}
