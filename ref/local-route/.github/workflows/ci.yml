name: local-route-ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci
      - run: python -m pip install -r server/requirements-optimizer.txt
      - run: npm run prisma:generate --workspace server
      # 테스트에는 DB 를 건드리는 경로가 있다(recordEvent 의 이벤트 Outbox 기록 등).
      # 지금까지 CI 에는 .env 가 없어 DATABASE_URL 이 비었고, 그 경로들이 전부 500 으로 떨어졌다.
      # 개발자 로컬(.env.example)과 같은 sqlite 파일을 만들어 같은 조건에서 검증한다.
      - run: npx prisma migrate deploy
        working-directory: server
        env: { DATABASE_URL: "file:./dev.db" }
      - run: npm audit --audit-level=high
      - run: npm test --workspace server
        env: { PYTHON_EXECUTABLE: python, DATABASE_URL: "file:./dev.db" }
      - run: npm run build --workspace server
      - run: npm run build --workspace web
