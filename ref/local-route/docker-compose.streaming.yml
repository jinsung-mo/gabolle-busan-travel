services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
  jobmanager:
    image: flink:2.1-java17
    command: jobmanager
    environment: [JOB_MANAGER_RPC_ADDRESS=jobmanager]
    ports: ["8081:8081"]
  taskmanager:
    image: flink:2.1-java17
    command: taskmanager
    depends_on: [jobmanager]
    environment: [JOB_MANAGER_RPC_ADDRESS=jobmanager]
  dispatcher:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["npm", "run", "events:dispatch", "--workspace", "server"]
    depends_on: [kafka]
    environment:
      DATABASE_URL: file:/data/local-route.db
      KAFKA_BROKERS: kafka:9092
    volumes: [local_route_data:/data]
volumes:
  local_route_data:
