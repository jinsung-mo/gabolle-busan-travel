# 핵심 플로우 — 회원가입. S15P21E201-777.
#
# 로그인이 아니라 회원가입을 고른 이유 — 로그인은 이미 인증된(이메일 확인을 마친)
# 계정이 있어야 하는데, 이 플로우는 실제 기기/에뮬레이터에서 반복 실행돼야 하고
# 매번 새 이메일을 검증할 방법이 없다. 회원가입은 계정이 없어도 되고, 화면이
# "이메일을 확인해 주세요"로 끝나는 지점까지가 이 앱의 핵심 진입 funnel이 실제로
# 도는지(빌드가 깨지지 않았는지, 폼·검증이 실제 기기에서 동작하는지)를 증명한다 —
# 실제 이메일 인증까지는 이 플로우의 책임이 아니다.
#
# 🔴 실측(2026-09-11) — 첫 실행(clearState 직후)은 언어 선택 스플래시("부산 가볼래?")
#    로 시작한다. "한국어로 시작하기"(accessibilityLabel, 화면에 보이는 글자는
#    "한국어"뿐이다)를 누르면 앱 소개 카루셀(app-intro)로 가는데, "건너뛰기"로
#    바로 지나간다. 이 스플래시는 인스톨 상태를 보존하는 에뮬레이터(이 저장소는
#    BlueStacks를 실기기 대안으로 쓴다 — S15P21E201-250)에서는 이전 실행의 흔적이
#    남아 있으면 안 뜬다 — 그래서 clearState가 중요하다.
#
# 🔴 실측(2026-09-11·미해결, S15P21E201-827) — 이 플로우는 회원가입 폼의 마지막
#    글자까지 정확히 채우고 제출 버튼까지 누르는 데는 성공하지만, 제출 뒤 화면이
#    "서버에 연결할 수 없어요"로 멈추고 "이메일을 확인해 주세요"에 닿지 못한다 —
#    같은 요청을 curl로 서버에 직접 보내면 201로 성공한다. 기기 자체의 브라우저로
#    같은 호스트에 접속하는 것과 호스트 PC에서 curl로 POST를 보내는 것은 둘 다
#    성공했다 — 환경의 일반 네트워크는 멀쩡하다.
#
#    🔴 2026-09-11 정정 — 처음엔 "안드로이드 에뮬레이터의 x86_64 아키텍처(실기기는
#    arm64)뿐"이라고 남겼었다. 틀렸다. 같은 날 Galaxy S10 실기기(arm64, Android 12,
#    보안 패치 2023-04-01 — 제조사 지원 종료)로 이 플로우를 그대로 돌려서 **똑같이
#    재현했다.** 진짜 공통점은 아키텍처가 아니라 "OS 수준 CA(인증 기관) 신뢰 저장소가
#    최신이 아니다"였다 — 서버가 내려주는 TLS 인증서 체인이 비교적 최근 루트(ISRG
#    Root X2)만 타고 있어서다. 같은 기기의 크롬(2022년부터 OS와 독립된 자체 Root
#    Store를 쓴다)은 정상 접속됐다 — 앱(OkHttp, OS 신뢰 저장소를 그대로 씀)만 막혔다.
#    자세한 진단은 S15P21E201-827 코멘트. 고치는 자리는 이 앱이 아니라 서버(EC2)의
#    TLS 인증서 체인 설정이다 — 서버가 고쳐지면 이 플로우가 그대로 통과해야 한다.
#    그래서 지금은 이 문서화된 이유로 마지막 단정에서 흉내 내지 않고 그대로 실패한다.
appId: com.gabolle.app
---
- launchApp:
    clearState: true
- tapOn: "한국어로 시작하기"
- tapOn: "건너뛰기"
- tapOn: "만 14세 이상이며, 위 내용을 확인했어요."
- tapOn: "계속"
- tapOn: "선택하고 로그인·회원가입으로"
# 🔴 실측(2026-09-11) — "선택하고 로그인·회원가입으로"는 로그인 화면으로 먼저 간다
#    (로그인·회원가입 결합 진입점). 거기서 "회원가입" 링크를 한 번 더 눌러야
#    실제 가입 폼(sign-up.tsx)에 닿는다.
# 🔴 실측(2026-09-11) — 로그인 화면의 "회원가입" 링크는 이 해상도(BlueStacks 기본
#    태블릿형 넓은 화면)에서 스크롤해도 안 잡혔다. 온보딩(연령 확인·권한 안내)을
#    이미 지난 뒤라 이번엔 딥링크가 홈으로 되돌아가지 않고 실제로 먹힌다.
- openLink: "gabolle://sign-up"
- runScript: signupEmail.js
- tapOn: "이메일"
- inputText: "${output.signupEmail}"
- tapOn: "비밀번호"
- inputText: "Maestro1234!"
- tapOn: "비밀번호 확인"
- inputText: "Maestro1234!"
# 🔴 실측(2026-09-11, Galaxy S10 실기기) — BlueStacks 기본 태블릿형 넓은 화면에서는
#    키보드가 떠도 "이름" 칸까지 다 보였지만, 실제 폰(1080x2280, 세로)에서는 키보드가
#    화면의 절반 가까이 덮어서 "비밀번호 확인" 입력칸 아래는 전부 가려진다 — "이름"이
#    안 보여서(element not found) 여기서 막혔다. 키보드를 내리지 않고(hideKeyboard는
#    이 화면에서 뒤로가기처럼 동작해 로그인 화면으로 튕긴다, 아래 실측 참고) scroll로
#    가려진 부분만 끌어올린다.
- scroll
- tapOn: "이름"
- inputText: "Maestro E2E"
# 🔴 실측(2026-09-11) — 바로 앞 "이름" 입력 뒤 키보드가 닫히는 애니메이션이 끝나기 전에
#    scroll을 부르면, 그 뒤 "만 14세 이상입니다." 탭이 좌표만 맞고(로그는 COMPLETED)
#    실제로는 안 눌린 채로 넘어갔다(체크 안 된 상태로 확인됨) — 요소가 아직 움직이는
#    중에 좌표를 계산한 것으로 보인다. hideKeyboard 명령은 (같은 실측) 이 화면에서
#    안드로이드 뒤로가기처럼 동작해 로그인 화면으로 튕겨 나갔다 — 대신 눌러도 아무 일도
#    안 나는 정적 문구("비밀번호가 일치해요.")를 한 번 눌러 포커스만 옮기고 키보드를
#    안전하게 닫는다. (좁은 화면에서는 "한국어" 버튼이 이 시점에 화면 밖에 있다.)
- tapOn: "비밀번호가 일치해요."
- scroll
- tapOn: "만 14세 이상입니다."
# 🔴 실측(2026-09-11) — tapOn의 문자열은 정규식이고, 부분 일치가 아니라 전체 일치다.
#    실제 문구는 "...동의합니다. (필수)"까지라 괄호 앞까지만 주면 "안 보임"으로 실패했다
#    (부분 일치였다면 애초에 괄호 이스케이프만 문제였을 텐데, 괄호를 아예 뺐는데도 안 잡혀
#    전체 일치임을 확인했다). .*로 나머지를 흡수한다.
- tapOn: "이용약관에 동의합니다.*"
- tapOn: "개인정보 처리방침에 동의합니다.*"
- tapOn: "회원가입"
- assertVisible: "이메일을 확인해 주세요"
