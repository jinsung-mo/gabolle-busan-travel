server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 배포가 끝났는데도 브라우저가 예전 화면을 유지하는 가장 흔한 원인은
    # 진입 문서(index.html)가 캐시된 상태로 이전 JS 번들을 계속 가리키는 것이다.
    # HTML은 매 요청마다 재검증하고, 파일명에 해시가 붙는 Expo 정적 번들만
    # 장기 캐시한다. 새 배포는 즉시 보이면서 같은 빌드의 자산은 재사용된다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # expo-router는 클라이언트 사이드 라우팅이라, 새로고침이나 직접 URL 접속
    # 시 실제 파일이 없는 경로도 index.html로 넘겨서 JS가 라우팅을 처리하게
    # 해야 한다. 파일이 실제로 있으면(js/css/이미지 등) 그대로 서빙한다.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
